<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw Private AI Assistant AWS Architecture</title>
  <desc id="desc">AWS reference architecture showing a client reaching API Gateway, a Lambda authorizer backed by Secrets Manager, an assistant Lambda using DynamoDB session memory, Amazon Bedrock, allow-listed tools, IAM, CloudWatch, and Terraform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04101d"/><stop offset="1" stop-color="#092744"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2a43"/><stop offset="1" stop-color="#071a2a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64b5ff"/></marker>
    <style>
      .title{font:700 48px Arial,sans-serif;fill:#fff}.sub{font:24px Arial,sans-serif;fill:#b9d6ef}.section{font:700 24px Arial,sans-serif;fill:#fff}.svc{font:700 19px Arial,sans-serif;fill:#fff}.txt{font:15px Arial,sans-serif;fill:#c9d9e7}.small{font:14px Arial,sans-serif;fill:#8eb2cf}.tag{font:700 14px Arial,sans-serif;fill:#9fd2ff}.icon{font:700 24px Arial,sans-serif;fill:#fff}.arrow{stroke:#64b5ff;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#64b5ff;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="38" y="28" width="1524" height="112" rx="22" fill="#0b2b4b" stroke="#1f5d87"/>
  <text x="800" y="78" text-anchor="middle" class="title">OpenClaw Private AI Assistant</text>
  <text x="800" y="114" text-anchor="middle" class="sub">Secure AWS reference architecture for private memory, controlled tools, and Bedrock inference</text>

  <rect x="55" y="235" width="210" height="340" rx="18" fill="#0a2440" stroke="#3f86c7" stroke-width="2"/>
  <text x="160" y="275" text-anchor="middle" class="section">Client</text>
  <circle cx="160" cy="355" r="54" fill="#1e70c9"/><text x="160" y="364" text-anchor="middle" class="icon">USER</text>
  <text x="160" y="445" text-anchor="middle" class="svc">Web / CLI / App</text>
  <text x="160" y="473" text-anchor="middle" class="txt">Bearer-authenticated</text>
  <text x="160" y="496" text-anchor="middle" class="txt">chat request</text>

  <rect x="305" y="180" width="1120" height="575" rx="24" fill="#071c2e" stroke="#3c9ee8" stroke-width="3"/>
  <text x="345" y="220" class="tag">AWS CLOUD · TERRAFORM-DEFINED REFERENCE STACK</text>

  <g filter="url(#shadow)">
    <rect x="350" y="300" width="180" height="165" rx="18" fill="#6e43d6"/>
    <text x="440" y="350" text-anchor="middle" class="icon">API</text>
    <text x="440" y="392" text-anchor="middle" class="svc">Amazon API Gateway</text>
    <text x="440" y="422" text-anchor="middle" class="txt">HTTPS entry point</text>
    <text x="440" y="444" text-anchor="middle" class="txt">routing + throttling</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="605" y="270" width="205" height="190" rx="18" fill="#d95f05"/>
    <text x="708" y="324" text-anchor="middle" class="icon">λ AUTH</text>
    <text x="708" y="367" text-anchor="middle" class="svc">Lambda Authorizer</text>
    <text x="708" y="397" text-anchor="middle" class="txt">Validates bearer token</text>
    <text x="708" y="420" text-anchor="middle" class="txt">Separate IAM role</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="605" y="505" width="205" height="150" rx="18" fill="#d43450"/>
    <text x="708" y="552" text-anchor="middle" class="icon">SECRET</text>
    <text x="708" y="592" text-anchor="middle" class="svc">AWS Secrets Manager</text>
    <text x="708" y="621" text-anchor="middle" class="txt">API token container</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="875" y="270" width="220" height="190" rx="18" fill="#ed7200"/>
    <text x="985" y="324" text-anchor="middle" class="icon">λ AI</text>
    <text x="985" y="367" text-anchor="middle" class="svc">Assistant Lambda</text>
    <text x="985" y="397" text-anchor="middle" class="txt">Orchestration + policy</text>
    <text x="985" y="420" text-anchor="middle" class="txt">Session validation</text>
    <text x="985" y="443" text-anchor="middle" class="txt">Approval gating</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1160" y="245" width="210" height="145" rx="18" fill="#0c9d91"/>
    <text x="1265" y="292" text-anchor="middle" class="icon">AI</text>
    <text x="1265" y="332" text-anchor="middle" class="svc">Amazon Bedrock</text>
    <text x="1265" y="360" text-anchor="middle" class="txt">Configured model only</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1160" y="430" width="210" height="145" rx="18" fill="#355bd6"/>
    <text x="1265" y="478" text-anchor="middle" class="icon">DB</text>
    <text x="1265" y="518" text-anchor="middle" class="svc">Amazon DynamoDB</text>
    <text x="1265" y="546" text-anchor="middle" class="txt">Session-scoped memory</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="875" y="520" width="220" height="135" rx="18" fill="#147f73"/>
    <text x="985" y="565" text-anchor="middle" class="icon">TOOLS</text>
    <text x="985" y="605" text-anchor="middle" class="svc">Allow-listed Tools</text>
    <text x="985" y="633" text-anchor="middle" class="txt">Read-only registry</text>
  </g>

  <path class="arrow" d="M265 405 H340"/>
  <path class="arrow" d="M530 382 H595"/>
  <path class="arrow" d="M810 365 H865"/>
  <path class="arrow" d="M708 460 V495"/>
  <path class="arrow" d="M1095 330 H1150"/>
  <path class="arrow" d="M1095 392 C1130 392 1125 502 1150 502"/>
  <path class="arrow" d="M985 460 V510"/>

  <rect x="350" y="675" width="1020" height="58" rx="14" fill="#0b2944" stroke="#2b648c"/>
  <text x="380" y="710" class="svc">Supporting controls:</text>
  <text x="590" y="710" class="txt">Least-privilege IAM roles</text>
  <text x="820" y="710" class="txt">Amazon CloudWatch logs</text>
  <text x="1060" y="710" class="txt">No prompt bodies in access logs</text>

  <rect x="55" y="790" width="1490" height="72" rx="18" fill="#082139" stroke="#24577d"/>
  <text x="90" y="820" class="svc">Deployment status:</text>
  <text x="280" y="820" class="txt">repository implementation + CI validated; AWS resources are created only when the operator runs Terraform apply.</text>
  <text x="90" y="846" class="small">Local Docker mode uses the same application with SQLite memory and a deterministic demo provider when Bedrock is not enabled.</text>
</svg>