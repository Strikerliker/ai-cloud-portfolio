<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">AI Output Firewall AWS Architecture</title>
<desc id="desc">AWS architecture diagram with API Gateway, Lambda, Bedrock, S3, Knowledge Base, OpenSearch, DynamoDB and CloudWatch, plus PASS WARN REJECT verification outcomes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061625"/><stop offset="1" stop-color="#03101b"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d263d"/><stop offset="1" stop-color="#081b2d"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66b9ff"/></marker>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#f5fbff}.m{font-family:Arial,Helvetica,sans-serif;fill:#a7c4dc}.h{font-weight:700}.svc{fill:url(#panel);stroke:#244f70;stroke-width:1.6}.line{stroke:#66b9ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#5b88ac;stroke-width:2.4;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}.cap{font-size:13px;letter-spacing:2px;fill:#71bfff}.small{font-size:14px}.tiny{font-size:12px}
  </style>
</defs>

<rect width="1400" height="820" rx="20" fill="url(#bg)"/>
<rect x="24" y="24" width="1352" height="772" rx="22" fill="none" stroke="#173b56" stroke-width="2"/>
<text x="700" y="68" text-anchor="middle" class="t h" font-size="38">AI OUTPUT FIREWALL</text>
<text x="700" y="98" text-anchor="middle" class="m" font-size="18">AWS Architecture • Generate • Retrieve • Verify • Decide</text>

