<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Secure AI API Deployment AWS Architecture</title>
  <desc id="desc">Reference architecture showing client requests entering Amazon API Gateway, a Lambda authorizer validating a token from AWS Secrets Manager, an inference Lambda invoking Amazon Bedrock, CloudWatch logging, and least-privilege IAM boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#061a33"/><stop offset="1" stop-color="#03101f"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c3158"/><stop offset="1" stop-color="#09233f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57a8ff"/></marker>
    <style>
      .title{font:700 44px Arial,sans-serif;fill:#fff}.sub{font:24px Arial,sans-serif;fill:#b9d6f4}.section{font:700 24px Arial,sans-serif;fill:#fff}.svcTitle{font:700 19px Arial,sans-serif;fill:#fff}.svcText{font:15px Arial,sans-serif;fill:#c7d9ea}.small{font:14px Arial,sans-serif;fill:#9fc1e2}.awsLabel{font:700 18px Arial,sans-serif;fill:#ffb449}.iconText{font:700 20px Arial,sans-serif;fill:#fff}.arrow{stroke:#57a8ff;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="28" y="24" width="1544" height="106" rx="22" fill="#0a2a4d"/>
  <text x="800" y="70" text-anchor="middle" class="title">Secure AI API Deployment</text>
  <text x="800" y="105" text-anchor="middle" class="sub">AWS Bedrock DevSecOps Reference Architecture</text>

  <rect x="55" y="255" width="210" height="320" rx="18" fill="#0a2440" stroke="#2a74b8" stroke-width="2"/>
  <text x="160" y="300" text-anchor="middle" class="section">Client</text>
  <circle cx="160" cy="380" r="52" fill="#1273de"/>
  <text x="160" y="389" text-anchor="middle" class="iconText">HTTPS</text>
  <text x="160" y="475" text-anchor="middle" class="svcTitle">API Consumer</text>
  <text x="160" y="503" text-anchor="middle" class="svcText">GET /health</text>
  <text x="160" y="528" text-anchor="middle" class="svcText">POST /v1/generate</text>

  <rect x="315" y="160" width="1210" height="620" rx="24" fill="#071f38" stroke="#5aa8ef" stroke-width="3"/>
  <text x="355" y="202" class="awsLabel">AWS CLOUD</text>
  <text x="1480" y="202" text-anchor="end" class="small">Controlled ingress · Least privilege · Observable</text>

  <g filter="url(#shadow)"><rect x="365" y="320" width="190" height="190" rx="18" fill="#5a33d6"/><text x="460" y="372" text-anchor="middle" class="iconText">API</text><text x="460" y="417" text-anchor="middle" class="svcTitle">Amazon API Gateway</text><text x="460" y="448" text-anchor="middle" class="svcText">Routes · CORS · throttling</text><text x="460" y="474" text-anchor="middle" class="svcText">Access logging</text></g>

  <g filter="url(#shadow)"><rect x="620" y="275" width="205" height="205" rx="18" fill="#ef7800"/><text x="723" y="333" text-anchor="middle" class="iconText">λ AUTH</text><text x="723" y="376" text-anchor="middle" class="svcTitle">Lambda Authorizer</text><text x="723" y="407" text-anchor="middle" class="svcText">Bearer-token validation</text><text x="723" y="433" text-anchor="middle" class="svcText">Constant-time compare</text></g>

  <g filter="url(#shadow)"><rect x="620" y="545" width="205" height="150" rx="18" fill="#d9344a"/><text x="723" y="592" text-anchor="middle" class="iconText">SECRET</text><text x="723" y="634" text-anchor="middle" class="svcTitle">AWS Secrets Manager</text><text x="723" y="662" text-anchor="middle" class="svcText">API token value</text></g>

  <g filter="url(#shadow)"><rect x="900" y="275" width="205" height="205" rx="18" fill="#ef7800"/><text x="1003" y="333" text-anchor="middle" class="iconText">λ AI</text><text x="1003" y="376" text-anchor="middle" class="svcTitle">Inference Lambda</text><text x="1003" y="407" text-anchor="middle" class="svcText">JSON validation</text><text x="1003" y="433" text-anchor="middle" class="svcText">Prompt-length checks</text></g>

  <g filter="url(#shadow)"><rect x="1175" y="275" width="205" height="205" rx="18" fill="#0aa595"/><text x="1278" y="333" text-anchor="middle" class="iconText">AI</text><text x="1278" y="376" text-anchor="middle" class="svcTitle">Amazon Bedrock</text><text x="1278" y="407" text-anchor="middle" class="svcText">Foundation-model inference</text><text x="1278" y="433" text-anchor="middle" class="svcText">Scoped model permission</text></g>

  <path class="arrow" d="M265 415 H355"/>
  <path class="arrow" d="M555 385 H610"/>
  <path class="arrow" d="M825 377 H890"/>
  <path class="arrow" d="M1105 377 H1165"/>
  <path class="arrow" d="M723 480 V535"/>
  <text x="585" y="362" text-anchor="middle" class="small">Protected route</text>
  <text x="722" y="523" text-anchor="middle" class="small">Read secret</text>
  <text x="860" y="356" text-anchor="middle" class="small">Authorized</text>

  <rect x="885" y="545" width="510" height="150" rx="18" fill="url(#panel)" stroke="#356a9e"/>
  <text x="1140" y="580" text-anchor="middle" class="section">Security & Observability</text>
  <g transform="translate(915 602)"><rect width="135" height="66" rx="12" fill="#d9344a"/><text x="68" y="28" text-anchor="middle" class="iconText">IAM</text><text x="68" y="51" text-anchor="middle" class="svcText">Least privilege</text></g>
  <g transform="translate(1073 602)"><rect width="135" height="66" rx="12" fill="#cf2f7e"/><text x="68" y="28" text-anchor="middle" class="iconText">CW</text><text x="68" y="51" text-anchor="middle" class="svcText">CloudWatch</text></g>
  <g transform="translate(1231 602)"><rect width="135" height="66" rx="12" fill="#244bd9"/><text x="68" y="28" text-anchor="middle" class="iconText">TF</text><text x="68" y="51" text-anchor="middle" class="svcText">Terraform</text></g>

  <rect x="55" y="815" width="1470" height="55" rx="16" fill="#09233e" stroke="#204d77"/>
  <text x="800" y="849" text-anchor="middle" class="svcText">Reference implementation: health check remains public, inference is authorized, secrets stay out of source/state, and telemetry avoids request bodies and bearer tokens.</text>
</svg>