  <style>
    .title{font:700 42px Arial,sans-serif;fill:#0b2145}.subtitle{font:18px Arial,sans-serif;fill:#58708a;letter-spacing:4px}.panelTitle{font:700 23px Arial,sans-serif;fill:#0e2d56}.panelSub{font:13px Arial,sans-serif;fill:#668099;letter-spacing:.4px}.svc{font:700 20px Arial,sans-serif;fill:#102d56}.txt{font:16px Arial,sans-serif;fill:#536d86}.small{font:14px Arial,sans-serif;fill:#6b8399}.icon{font:700 20px Arial,sans-serif;fill:#fff}.arrow{stroke:#1c5b91;stroke-width:4;fill:none;marker-end:url(#arrow)}.supportTitle{font:700 18px Arial,sans-serif;fill:#fff}.supportText{font:15px Arial,sans-serif;fill:#536d86}
  </style>
