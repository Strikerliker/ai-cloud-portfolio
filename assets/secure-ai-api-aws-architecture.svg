<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">Secure AI API Deployment - AWS Bedrock DevSecOps Architecture</title>
<desc id="desc">AWS reference architecture showing users, Route 53, CloudFront, WAF, Cognito, API Gateway, Lambda, Bedrock, Secrets Manager, S3, DynamoDB, CloudWatch, KMS, and a DevSecOps CI/CD pipeline.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity=".16"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#173f6d"/></marker>
  <style>
    .h1{font:700 40px Arial,sans-serif;fill:#0a2148}.sub{font:18px Arial,sans-serif;fill:#52708f;letter-spacing:5px}.panelTitle{font:700 22px Arial,sans-serif;fill:#0c2d57}.panelSub{font:13px Arial,sans-serif;fill:#5d7690}.svc{font:700 17px Arial,sans-serif;fill:#102d56}.txt{font:14px Arial,sans-serif;fill:#526c86}.small{font:12px Arial,sans-serif;fill:#668099}.white{font:700 19px Arial,sans-serif;fill:#fff}.arrow{stroke:#173f6d;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#5b6dc8;stroke-width:2.5;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
  </style>
</defs>
