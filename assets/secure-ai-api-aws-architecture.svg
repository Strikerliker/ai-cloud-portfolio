<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Secure AI API Deployment - AWS Bedrock DevSecOps Architecture</title>
<desc id="desc">AWS reference architecture for the Secure AI API Deployment project showing clients, API Gateway, Lambda authorizer, Secrets Manager, inference Lambda, Amazon Bedrock, IAM, CloudWatch, Terraform, and GitHub Actions validation.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#18324d" flood-opacity=".16"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#184b7a"/></marker>
  <style>
    .h1{font:700 40px Arial,sans-serif;fill:#0b2145}.sub{font:18px Arial,sans-serif;fill:#536d88;letter-spacing:5px}.panelTitle{font:700 22px Arial,sans-serif;fill:#0d2b55}.panelSub{font:13px Arial,sans-serif;fill:#60758b}.svc{font:700 18px Arial,sans-serif;fill:#102b52}.txt{font:14px Arial,sans-serif;fill:#536b82}.small{font:13px Arial,sans-serif;fill:#687f96}.icon{font:700 20px Arial,sans-serif;fill:white}.arrow{stroke:#184b7a;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6a78c8;stroke-width:2.5;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="900" fill="#f7f9fc"/>
<text x="800" y="55" text-anchor="middle" class="h1">Secure AI API Deployment - AWS Bedrock DevSecOps Architecture</text>
<text x="800" y="88" text-anchor="middle" class="sub">SECURE | SERVERLESS | MONITORED | INFRASTRUCTURE AS CODE</text>

<!-- USERS -->
<g filter="url(#shadow)"><rect x="24" y="125" width="170" height="425" rx="14" fill="#fff" stroke="#b9cfe4"/></g>
<text x="109" y="158" text-anchor="middle" class="panelTitle">Users / Clients</text>
<circle cx="109" cy="226" r="42" fill="#1f5f9f"/><text x="109" y="234" text-anchor="middle" class="icon">USER</text>
<text x="109" y="288" text-anchor="middle" class="svc">API Consumer</text>
<rect x="60" y="330" width="98" height="72" rx="10" fill="#edf4fb" stroke="#9bbbd7"/><text x="109" y="359" text-anchor="middle" class="svc">Web App</text><text x="109" y="383" text-anchor="middle" class="small">HTTPS</text>
<rect x="60" y="424" width="98" height="72" rx="10" fill="#edf4fb" stroke="#9bbbd7"/><text x="109" y="453" text-anchor="middle" class="svc">Mobile / CLI</text><text x="109" y="477" text-anchor="middle" class="small">REST client</text>

<!-- EDGE / API -->
<g filter="url(#shadow)"><rect x="210" y="125" width="330" height="425" rx="14" fill="#fff" stroke="#b9cfe4"/></g>
<text x="235" y="158" class="panelTitle">API Boundary</text><text x="235" y="181" class="panelSub">CONTROLLED INGRESS &amp; ROUTING</text>
<g transform="translate(262 230)"><rect width="120" height="120" rx="18" fill="#7b3fe4"/><text x="60" y="53" text-anchor="middle" class="icon">API</text><text x="60" y="82" text-anchor="middle" class="icon">GW</text></g>
<text x="322" y="376" text-anchor="middle" class="svc">Amazon API Gateway</text><text x="322" y="399" text-anchor="middle" class="txt">GET /health</text><text x="322" y="421" text-anchor="middle" class="txt">POST /v1/generate</text><text x="322" y="443" text-anchor="middle" class="txt">Throttling · CORS · logs</text>
<rect x="405" y="230" width="92" height="120" rx="14" fill="#113c6c"/><text x="451" y="280" text-anchor="middle" class="icon">TLS</text><text x="451" y="309" text-anchor="middle" class="icon">HTTPS</text>
<text x="451" y="376" text-anchor="middle" class="svc">Protected route</text><text x="451" y="399" text-anchor="middle" class="txt">Bearer token</text>

<!-- AUTH -->
<g filter="url(#shadow)"><rect x="558" y="125" width="320" height="425" rx="14" fill="#fff" stroke="#b9cfe4"/></g>
<text x="583" y="158" class="panelTitle">Authentication &amp; Authorization</text><text x="583" y="181" class="panelSub">SECRET-BACKED ACCESS CONTROL</text>
<g transform="translate(596 225)"><rect width="120" height="120" rx="18" fill="#f07b13"/><text x="60" y="72" text-anchor="middle" class="icon">λ AUTH</text></g>
<text x="656" y="373" text-anchor="middle" class="svc">Lambda Authorizer</text><text x="656" y="396" text-anchor="middle" class="txt">Constant-time token check</text><text x="656" y="418" text-anchor="middle" class="txt">Separate IAM role</text>
<g transform="translate(735 225)"><rect width="105" height="120" rx="18" fill="#dc3150"/><text x="52" y="57" text-anchor="middle" class="icon">SECRET</text><text x="52" y="84" text-anchor="middle" class="icon">KEY</text></g>
<text x="787" y="373" text-anchor="middle" class="svc">Secrets Manager</text><text x="787" y="396" text-anchor="middle" class="txt">Bearer token value</text><text x="787" y="418" text-anchor="middle" class="txt">Not in source / state</text>
<path class="arrow" d="M716 286H725"/>

<!-- APP -->
<g filter="url(#shadow)"><rect x="896" y="125" width="250" height="425" rx="14" fill="#fff" stroke="#b9cfe4"/></g>
<text x="921" y="158" class="panelTitle">Application Layer</text><text x="921" y="181" class="panelSub">SERVERLESS INFERENCE HANDLER</text>
<g transform="translate(958 225)"><rect width="126" height="126" rx="18" fill="#f07b13"/><text x="63" y="73" text-anchor="middle" class="icon">λ AI</text></g>
<text x="1021" y="381" text-anchor="middle" class="svc">Inference Lambda</text><text x="1021" y="404" text-anchor="middle" class="txt">JSON validation</text><text x="1021" y="426" text-anchor="middle" class="txt">Prompt length controls</text><text x="1021" y="448" text-anchor="middle" class="txt">Least-privilege model invoke</text>

<!-- AI -->
<g filter="url(#shadow)"><rect x="1164" y="125" width="412" height="425" rx="14" fill="#fff" stroke="#b9cfe4"/></g>
<text x="1189" y="158" class="panelTitle">AI Services</text><text x="1189" y="181" class="panelSub">GENERATIVE AI ON AWS</text>
<g transform="translate(1220 225)"><rect width="135" height="126" rx="18" fill="#0a9c88"/><text x="67" y="58" text-anchor="middle" class="icon">AMAZON</text><text x="67" y="86" text-anchor="middle" class="icon">BEDROCK</text></g>
<text x="1287" y="381" text-anchor="middle" class="svc">Amazon Bedrock</text><text x="1287" y="404" text-anchor="middle" class="txt">Foundation-model inference</text><text x="1287" y="426" text-anchor="middle" class="txt">Configured model only</text>
<rect x="1390" y="228" width="140" height="118" rx="15" fill="#eef9f6" stroke="#77c9b8"/><text x="1460" y="270" text-anchor="middle" class="svc">Response</text><text x="1460" y="298" text-anchor="middle" class="txt">JSON output</text><text x="1460" y="322" text-anchor="middle" class="txt">to client</text>
<path class="arrow" d="M1355 287H1380"/>

<!-- MAIN FLOW -->
<path class="arrow" d="M194 287H252"/><path class="arrow" d="M540 287H586"/><path class="arrow" d="M878 287H948"/><path class="arrow" d="M1146 287H1210"/>
<text x="222" y="270" text-anchor="middle" class="small">HTTPS</text><text x="563" y="270" text-anchor="middle" class="small">Authorize</text><text x="912" y="270" text-anchor="middle" class="small">Allowed</text><text x="1180" y="270" text-anchor="middle" class="small">Invoke</text>

<!-- SUPPORTING CONTROLS -->
<g filter="url(#shadow)"><rect x="210" y="580" width="936" height="205" rx="14" fill="#fff" stroke="#b9cfe4"/></g>
<text x="235" y="614" class="panelTitle">Security, Observability &amp; Infrastructure</text><text x="235" y="637" class="panelSub">SUPPORTING CONTROLS FOR THE REQUEST PATH</text>
<g transform="translate(260 665)"><rect width="160" height="78" rx="14" fill="#dc3150"/><text x="80" y="34" text-anchor="middle" class="icon">IAM</text><text x="80" y="58" text-anchor="middle" class="icon">ROLE</text></g><text x="340" y="767" text-anchor="middle" class="txt">Separate least-privilege roles</text>
<g transform="translate(485 665)"><rect width="160" height="78" rx="14" fill="#d72b7b"/><text x="80" y="47" text-anchor="middle" class="icon">CloudWatch</text></g><text x="565" y="767" text-anchor="middle" class="txt">API &amp; Lambda logs</text>
<g transform="translate(710 665)"><rect width="160" height="78" rx="14" fill="#3557cc"/><text x="80" y="47" text-anchor="middle" class="icon">Terraform</text></g><text x="790" y="767" text-anchor="middle" class="txt">Infrastructure as code</text>
<g transform="translate(935 665)"><rect width="160" height="78" rx="14" fill="#25374a"/><text x="80" y="36" text-anchor="middle" class="icon">GitHub</text><text x="80" y="60" text-anchor="middle" class="icon">Actions</text></g><text x="1015" y="767" text-anchor="middle" class="txt">Tests · Bandit · TF validation</text>
<path class="dash" d="M1021 550V650"/><path class="dash" d="M656 550V650"/><path class="dash" d="M787 550V650"/>

<!-- STATUS / NOTES -->
<g filter="url(#shadow)"><rect x="1164" y="580" width="412" height="205" rx="14" fill="#eefaf4" stroke="#a8d9bf"/></g>
<text x="1189" y="614" class="panelTitle" fill="#165f3d">Security &amp; DevSecOps</text>
<circle cx="1202" cy="660" r="10" fill="#1d9b5e"/><text x="1225" y="666" class="txt">Secret value excluded from source/state</text>
<circle cx="1202" cy="694" r="10" fill="#1d9b5e"/><text x="1225" y="700" class="txt">Request validation before model call</text>
<circle cx="1202" cy="728" r="10" fill="#1d9b5e"/><text x="1225" y="734" class="txt">Throttling and safe access logging</text>
<circle cx="1202" cy="762" r="10" fill="#1d9b5e"/><text x="1225" y="768" class="txt">CI validates code, security, and Terraform</text>

<rect x="24" y="815" width="1552" height="58" rx="14" fill="#0b2d50"/>
<text x="800" y="850" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#d9e8f6">Reference implementation: the repository implements API Gateway, Lambda authorizer, Secrets Manager, inference Lambda, Bedrock, IAM, CloudWatch, Terraform, tests, and GitHub Actions validation. It does not claim a live production deployment.</text>
</svg>