<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
<title id="title">Secure AI API Deployment - AWS Bedrock DevSecOps Architecture</title>
<desc id="desc">Clean AWS reference architecture showing clients, API Gateway, Lambda authorizer, Secrets Manager, inference Lambda, Amazon Bedrock, IAM, CloudWatch, Terraform, and GitHub Actions.</desc>
<defs>
