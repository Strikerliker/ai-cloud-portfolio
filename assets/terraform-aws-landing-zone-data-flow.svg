<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Terraform AWS Landing Zone – Data Flow</title>
<desc id="desc">Data flow from Terraform source control and CI validation through reviewed deployment into AWS governance, network, audit, and security foundations, followed by feedback from validation and operations.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182a"/><stop offset="1" stop-color="#03111e"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b263f"/><stop offset="1" stop-color="#081c30"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#72bfff"/></marker>
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#f5fbff}.m{font-family:Arial,Helvetica,sans-serif;fill:#a9c5db}.h{font-weight:700}.p{fill:url(#panel);stroke:#2b5c82;stroke-width:1.6}.line{stroke:#72bfff;stroke-width:3;fill:none;marker-end:url(#arr)}.dash{stroke:#6e99bd;stroke-width:2.2;fill:none;stroke-dasharray:7 6;marker-end:url(#arr)}.tiny{font-size:12px}.small{font-size:14px}.cap{font-size:13px;letter-spacing:2px;fill:#78c4ff}</style>
</defs>
<rect width="1600" height="900" rx="24" fill="url(#bg)"/>
<text x="800" y="58" text-anchor="middle" class="t h" font-size="40">Terraform AWS Landing Zone – Data Flow</text>
<text x="800" y="90" text-anchor="middle" class="m" font-size="18">How reviewed infrastructure-as-code moves from source control into a secure AWS foundation</text>

<g transform="translate(45 155)"><rect width="210" height="420" rx="18" class="p" filter="url(#sh)"/><circle cx="40" cy="40" r="20" fill="#2f80ed"/><text x="40" y="47" text-anchor="middle" class="t h" font-size="19">1</text><text x="105" y="92" text-anchor="middle" class="t h" font-size="19">Engineer / Admin</text><circle cx="105" cy="155" r="24" fill="none" stroke="#9dd8ff" stroke-width="4"/><path d="M67 218c4-48 72-48 76 0" fill="none" stroke="#9dd8ff" stroke-width="4"/><text x="105" y="270" text-anchor="middle" class="m small">Changes Terraform code</text><text x="105" y="294" text-anchor="middle" class="m small">Reviews variables</text><text x="105" y="318" text-anchor="middle" class="m small">Selects account / CIDR</text><text x="105" y="342" text-anchor="middle" class="m small">Approves deployment</text></g>

<g transform="translate(300 155)"><rect width="210" height="420" rx="18" class="p" filter="url(#sh)"/><circle cx="40" cy="40" r="20" fill="#2f80ed"/><text x="40" y="47" text-anchor="middle" class="t h" font-size="19">2</text><circle cx="105" cy="135" r="38" fill="#151515"/><text x="105" y="142" text-anchor="middle" class="t h" font-size="18">GH</text><text x="105" y="205" text-anchor="middle" class="t h" font-size="18">GitHub Repository</text><text x="105" y="232" text-anchor="middle" class="m small">Reusable Terraform</text><text x="105" y="256" text-anchor="middle" class="m small">Modules + environments</text><text x="105" y="280" text-anchor="middle" class="m small">Pull-request review</text></g>

<g transform="translate(555 155)"><rect width="220" height="420" rx="18" class="p" filter="url(#sh)"/><circle cx="40" cy="40" r="20" fill="#2f80ed"/><text x="40" y="47" text-anchor="middle" class="t h" font-size="19">3</text><rect x="72" y="95" width="76" height="76" rx="10" fill="#2f80ed"/><text x="110" y="142" text-anchor="middle" class="t h" font-size="16">CI/CD</text><text x="110" y="205" text-anchor="middle" class="t h" font-size="18">Validation Pipeline</text><text x="110" y="235" text-anchor="middle" class="m small">terraform fmt -check</text><text x="110" y="259" text-anchor="middle" class="m small">terraform init -backend=false</text><text x="110" y="283" text-anchor="middle" class="m small">terraform validate</text><rect x="33" y="325" width="154" height="42" rx="9" fill="#0c3f37"/><text x="110" y="352" text-anchor="middle" class="t h" font-size="13">Must pass before deploy</text></g>

<g transform="translate(820 155)"><rect width="220" height="420" rx="18" class="p" filter="url(#sh)"/><circle cx="40" cy="40" r="20" fill="#2f80ed"/><text x="40" y="47" text-anchor="middle" class="t h" font-size="19">4</text><rect x="72" y="95" width="76" height="76" rx="10" fill="#6544c6"/><text x="110" y="143" text-anchor="middle" class="t h" font-size="16">TF</text><text x="110" y="205" text-anchor="middle" class="t h" font-size="18">Terraform Plan</text><text x="110" y="235" text-anchor="middle" class="m small">Preview changes</text><text x="110" y="259" text-anchor="middle" class="m small">Review resources</text><text x="110" y="283" text-anchor="middle" class="m small">Confirm safe baseline</text><text x="110" y="307" text-anchor="middle" class="m small">Organizations opt-in only</text></g>

<g transform="translate(1085 155)"><rect width="220" height="420" rx="18" class="p" filter="url(#sh)"/><circle cx="40" cy="40" r="20" fill="#2f80ed"/><text x="40" y="47" text-anchor="middle" class="t h" font-size="19">5</text><rect x="72" y="95" width="76" height="76" rx="10" fill="#232F3E"/><text x="110" y="143" text-anchor="middle" class="t h" font-size="20">AWS</text><path d="M84 151c18 8 36 8 52 0" stroke="#ff9900" stroke-width="3" fill="none"/><text x="110" y="205" text-anchor="middle" class="t h" font-size="18">AWS Foundation</text><text x="110" y="235" text-anchor="middle" class="m small">VPC + subnet tiers</text><text x="110" y="259" text-anchor="middle" class="m small">CloudTrail + S3 + KMS</text><text x="110" y="283" text-anchor="middle" class="m small">GuardDuty + Security Hub</text><text x="110" y="307" text-anchor="middle" class="m small">EBS encryption + IAM</text><text x="110" y="331" text-anchor="middle" class="m small">Optional OU + SCP</text></g>

<g transform="translate(1350 155)"><rect width="205" height="420" rx="18" class="p" filter="url(#sh)"/><circle cx="40" cy="40" r="20" fill="#2f80ed"/><text x="40" y="47" text-anchor="middle" class="t h" font-size="19">6</text><rect x="65" y="95" width="76" height="76" rx="10" fill="#19a77b"/><path d="M83 132l15 15 27-34" stroke="#fff" stroke-width="4" fill="none"/><text x="103" y="205" text-anchor="middle" class="t h" font-size="18">Controlled Baseline</text><text x="103" y="235" text-anchor="middle" class="m small">Ready for workloads</text><text x="103" y="259" text-anchor="middle" class="m small">Audit visibility</text><text x="103" y="283" text-anchor="middle" class="m small">Threat detection</text><text x="103" y="307" text-anchor="middle" class="m small">Repeatable controls</text></g>

<path d="M255 365H300" class="line"/><path d="M510 365H555" class="line"/><path d="M775 365H820" class="line"/><path d="M1040 365H1085" class="line"/><path d="M1305 365H1350" class="line"/>

<rect x="180" y="650" width="1240" height="110" rx="16" fill="#09243b" stroke="#2b5c82"/>
<text x="800" y="681" text-anchor="middle" class="cap">FEEDBACK &amp; GOVERNANCE LOOP</text>
<text x="800" y="713" text-anchor="middle" class="m small">Review outputs, security findings, logging coverage, network design, and environment-specific changes before the next plan/apply cycle.</text>
<path d="M1450 575V800H150V575" class="dash"/>
<text x="800" y="845" text-anchor="middle" class="cap">CODE • VALIDATE • PLAN • REVIEW • APPLY • VERIFY</text>
</svg>