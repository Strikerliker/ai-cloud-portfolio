<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AWS Bedrock RAG Assistant Flow Chart</title>
<desc id="desc">Flow from user question through Streamlit or CLI, Python application, Amazon Bedrock RetrieveAndGenerate, Knowledge Base retrieval, S3 source documents, vector store, foundation model generation, and grounded answer with citations.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061522"/><stop offset="1" stop-color="#02101b"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b243a"/><stop offset="1" stop-color="#071a2b"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67baff"/></marker>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#f6fbff}.m{font-family:Arial,Helvetica,sans-serif;fill:#a9c5db}.h{font-weight:700}
    .panel{fill:url(#panel);stroke:#26506f;stroke-width:1.6}.soft{fill:#0a2032;stroke:#315e80;stroke-width:1.4}
    .line{stroke:#67baff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6c96b9;stroke-width:2.2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    .small{font-size:14px}.tiny{font-size:12px}.cap{font-size:13px;letter-spacing:2px;fill:#73c1ff}.num{fill:#1479d5}.numtxt{font-family:Arial,Helvetica,sans-serif;fill:#fff;font-size:16px;font-weight:700;text-anchor:middle}
  </style>
</defs>
<rect width="1600" height="900" rx="22" fill="url(#bg)"/>
<rect x="24" y="24" width="1552" height="852" rx="22" fill="none" stroke="#173d58" stroke-width="2"/>
<text x="800" y="68" text-anchor="middle" class="t h" font-size="40">AWS Bedrock RAG Assistant – Flow Chart</text>
<text x="800" y="100" text-anchor="middle" class="m" font-size="18">From question to grounded answer using approved enterprise knowledge</text>

<!-- 1 User -->
<g transform="translate(45 170)">
  <rect width="175" height="250" rx="16" class="panel" filter="url(#shadow)"/>
  <circle cx="28" cy="28" r="18" class="num"/><text x="28" y="34" class="numtxt">1</text>
  <circle cx="88" cy="92" r="18" fill="#4d789c"/><path d="M58 137c4-35 56-35 60 0Z" fill="#4d789c"/>
  <text x="88" y="174" text-anchor="middle" class="t h" font-size="18">User</text>
  <text x="88" y="199" text-anchor="middle" class="m small">Asks a question</text>
  <text x="88" y="222" text-anchor="middle" class="m tiny">Business or support query</text>
</g>

<!-- 2 UI -->
<g transform="translate(260 170)">
  <rect width="190" height="250" rx="16" class="panel" filter="url(#shadow)"/>
  <circle cx="28" cy="28" r="18" class="num"/><text x="28" y="34" class="numtxt">2</text>
  <rect x="54" y="68" width="82" height="58" rx="8" fill="#1f6eb4"/><path d="M66 83h58M66 97h39M66 111h48" stroke="#fff" stroke-width="3"/>
  <text x="95" y="158" text-anchor="middle" class="t h" font-size="18">Streamlit / CLI</text>
  <text x="95" y="184" text-anchor="middle" class="m small">Demo interface</text>
  <text x="95" y="208" text-anchor="middle" class="m tiny">Submits query to Python app</text>
</g>

<!-- 3 Python -->
<g transform="translate(495 170)">
  <rect width="205" height="250" rx="16" class="panel" filter="url(#shadow)"/>
  <circle cx="28" cy="28" r="18" class="num"/><text x="28" y="34" class="numtxt">3</text>
  <rect x="64" y="64" width="78" height="78" rx="12" fill="#ffd343"/><text x="103" y="112" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#24527a">PY</text>
  <text x="103" y="172" text-anchor="middle" class="t h" font-size="18">Python Application</text>
  <text x="103" y="198" text-anchor="middle" class="m small">Validates config</text>
  <text x="103" y="221" text-anchor="middle" class="m tiny">Maintains Bedrock session ID</text>
</g>

<!-- 4 Bedrock runtime -->
<g transform="translate(745 170)">
  <rect width="220" height="250" rx="16" class="panel" filter="url(#shadow)"/>
  <circle cx="28" cy="28" r="18" class="num"/><text x="28" y="34" class="numtxt">4</text>
  <rect x="72" y="64" width="78" height="78" rx="12" fill="#08A69B"/>
  <path d="M90 82l21-12 21 12v38l-21 12-21-12zM99 82v38m24-38v38m-33-19h42" stroke="#fff" stroke-width="3" fill="none"/>
  <text x="110" y="172" text-anchor="middle" class="t h" font-size="18">Amazon Bedrock</text>
  <text x="110" y="195" text-anchor="middle" class="t h" font-size="15">RetrieveAndGenerate</text>
  <text x="110" y="220" text-anchor="middle" class="m tiny">Agent Runtime request</text>
</g>

<!-- 5 KB -->
<g transform="translate(1010 150)">
  <rect width="330" height="290" rx="16" class="panel" filter="url(#shadow)"/>
  <circle cx="28" cy="28" r="18" class="num"/><text x="28" y="34" class="numtxt">5</text>
  <text x="165" y="48" text-anchor="middle" class="t h" font-size="19">Bedrock Knowledge Base</text>
  <text x="165" y="72" text-anchor="middle" class="m small">Retrieves the most relevant chunks</text>
  <rect x="35" y="105" width="110" height="120" rx="12" class="soft"/>
  <rect x="65" y="123" width="50" height="50" rx="8" fill="#7AA116"/>
  <ellipse cx="90" cy="137" rx="14" ry="5" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M76 137v21c0 7 28 7 28 0v-21" fill="none" stroke="#fff" stroke-width="2.4"/>
  <text x="90" y="196" text-anchor="middle" class="t h" font-size="14">Amazon S3</text><text x="90" y="214" text-anchor="middle" class="m tiny">Approved docs</text>
  <rect x="185" y="105" width="110" height="120" rx="12" class="soft"/>
  <rect x="215" y="123" width="50" height="50" rx="8" fill="#8C4FFF"/>
  <circle cx="238" cy="145" r="10" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M245 152l9 9" stroke="#fff" stroke-width="2.4"/>
  <text x="240" y="196" text-anchor="middle" class="t h" font-size="14">Vector Store</text><text x="240" y="214" text-anchor="middle" class="m tiny">Semantic retrieval</text>
  <path d="M145 166H185" class="dash"/>
  <text x="165" y="258" text-anchor="middle" class="m tiny">Configured through Bedrock Knowledge Bases</text>
</g>

<!-- 6 Foundation model -->
<g transform="translate(1380 170)">
  <rect width="175" height="250" rx="16" class="panel" filter="url(#shadow)"/>
  <circle cx="28" cy="28" r="18" class="num"/><text x="28" y="34" class="numtxt">6</text>
  <rect x="49" y="65" width="78" height="78" rx="12" fill="#08A69B"/>
  <path d="M67 86c14-18 36-18 42 0m-42 31c14 18 36 18 42 0M88 76v50M76 94h25M76 108h25" stroke="#fff" stroke-width="3" fill="none"/>
  <text x="88" y="174" text-anchor="middle" class="t h" font-size="17">Foundation Model</text>
  <text x="88" y="199" text-anchor="middle" class="m small">Generates answer</text>
  <text x="88" y="222" text-anchor="middle" class="m tiny">Uses retrieved context</text>
</g>

<!-- arrows main -->
<path d="M220 295H260" class="line"/><path d="M450 295H495" class="line"/><path d="M700 295H745" class="line"/><path d="M965 295H1010" class="line"/><path d="M1340 295H1380" class="line"/>

<!-- response -->
<rect x="305" y="500" width="990" height="105" rx="15" class="panel" filter="url(#shadow)"/>
<circle cx="345" cy="552" r="25" fill="#11a27f"/><path d="M334 552l8 8 16-19" stroke="#fff" stroke-width="4" fill="none"/>
<text x="390" y="540" class="t h" font-size="19">7 · Grounded Answer + Source References</text>
<text x="390" y="569" class="m small">The application returns the answer and source locations so the user can verify the response.</text>
<path d="M1468 420V552H1295" class="line"/>
<path d="M305 552H165V420" class="line"/>

<!-- security -->
<text x="800" y="675" text-anchor="middle" class="cap">SUPPORTING SECURITY &amp; OPERATIONS</text>
<g transform="translate(220 710)">
 <rect width="330" height="105" rx="13" class="soft"/>
 <rect x="22" y="21" width="62" height="62" rx="10" fill="#DD344C"/>
 <path d="M38 51h30v23H38zM44 51V40c0-13 18-13 18 0v11" fill="none" stroke="#fff" stroke-width="3"/>
 <text x="104" y="46" class="t h" font-size="16">AWS IAM</text><text x="104" y="70" class="m small">Least-privilege access</text>
</g>
<g transform="translate(635 710)">
 <rect width="330" height="105" rx="13" class="soft"/>
 <rect x="22" y="21" width="62" height="62" rx="10" fill="#D82B78"/>
 <path d="M35 64l11-12 10 6 15-20M35 71h36" stroke="#fff" stroke-width="3" fill="none"/>
 <text x="104" y="46" class="t h" font-size="16">Amazon CloudWatch</text><text x="104" y="70" class="m small">Logs, errors, latency &amp; telemetry</text>
</g>
<g transform="translate(1050 710)">
 <rect width="330" height="105" rx="13" class="soft"/>
 <rect x="22" y="21" width="62" height="62" rx="10" fill="#2f6cab"/>
 <path d="M39 39h28v28H39zM46 46h14M46 54h14" stroke="#fff" stroke-width="3" fill="none"/>
 <text x="104" y="46" class="t h" font-size="16">Output Validation</text><text x="104" y="70" class="m small">Treat generated text as advisory</text>
</g>
</svg>