<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Terraform AWS Landing Zone – AWS Architecture</title>
<desc id="desc">AWS landing zone architecture with recognizable AWS service-style symbols for Organizations, Control Tower, IAM Identity Center, S3, DynamoDB, GuardDuty, Security Hub, Config, CloudTrail, VPC, Transit Gateway, Route 53, Systems Manager, KMS, CloudWatch, workload accounts, GitHub, and Terraform.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06182d"/><stop offset="1" stop-color="#03111f"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2a46"/><stop offset="1" stop-color="#071b30"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#65c1ff"/></marker>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#f7fbff}.m{font-family:Arial,Helvetica,sans-serif;fill:#a9c5db}.h{font-weight:700}
    .card{fill:url(#card);stroke:#2c79aa;stroke-width:1.5}.zone{fill:#0a2036;stroke:#28a9ff;stroke-width:2}.gov{fill:#172046;stroke:#9c6cff;stroke-width:2}.sec{fill:#2a1725;stroke:#ff4d73;stroke-width:2}.net{fill:#102438;stroke:#28a9ff;stroke-width:2}.shared{fill:#0d2b24;stroke:#2ed08a;stroke-width:2}.work{fill:#2b2114;stroke:#ff9d35;stroke-width:2}
    .line{stroke:#65c1ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#9f7bff;stroke-width:2.2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    .small{font-size:13px}.tiny{font-size:11px}.cap{font-size:12px;letter-spacing:2px;fill:#6ec1ff}
  </style>
</defs>
<rect width="1600" height="900" rx="24" fill="url(#bg)"/>
<text x="800" y="52" text-anchor="middle" class="t h" font-size="40">Terraform AWS Landing Zone – AWS Architecture</text>
<text x="800" y="84" text-anchor="middle" class="m" font-size="18">Secure multi-account foundation managed with Terraform and AWS governance services</text>

