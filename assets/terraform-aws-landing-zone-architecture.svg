<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Terraform AWS Landing Zone Architecture</title>
<desc id="desc">AWS landing zone reference architecture showing AWS Organizations and SCP guardrails, a landing zone account, multi-AZ VPC networking, CloudTrail audit logging to encrypted S3, GuardDuty, Security Hub, EBS encryption, IAM controls, Terraform, and GitHub Actions validation.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324d" flood-opacity=".16"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#1d5f94"/></marker>
  <style>
    .h1{font:700 42px Arial,sans-serif;fill:#0b2145}.sub{font:18px Arial,sans-serif;fill:#5c7288;letter-spacing:4px}.panelTitle{font:700 23px Arial,sans-serif;fill:#0e2d56}.panelSub{font:13px Arial,sans-serif;fill:#668099;letter-spacing:.5px}.svc{font:700 19px Arial,sans-serif;fill:#102d56}.txt{font:15px Arial,sans-serif;fill:#536d86}.small{font:13px Arial,sans-serif;fill:#6b8399}.icon{font:700 18px Arial,sans-serif;fill:#fff}.arrow{stroke:#1d5f94;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#6a78c8;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="900" fill="#f6f9fc"/>
<text x="800" y="55" text-anchor="middle" class="h1">Terraform AWS Landing Zone - Secure Cloud Foundation</text>
<text x="800" y="88" text-anchor="middle" class="sub">GOVERNANCE | NETWORKING | AUDIT | SECURITY | INFRASTRUCTURE AS CODE</text>

<!-- GOVERNANCE -->
<g filter="url(#shadow)"><rect x="40" y="135" width="280" height="300" rx="16" fill="#fff" stroke="#b7cee3"/></g>
<text x="180" y="172" text-anchor="middle" class="panelTitle">Governance</text>
<text x="180" y="197" text-anchor="middle" class="panelSub">OPTIONAL ORGANIZATION CONTROLS</text>
<rect x="92" y="235" width="176" height="88" rx="16" fill="#7b3fe4"/><text x="180" y="272" text-anchor="middle" class="icon">AWS ORGANIZATIONS</text><text x="180" y="299" text-anchor="middle" class="icon">OU + SCP</text>
<text x="180" y="354" text-anchor="middle" class="svc">Approved-Regions Guardrail</text>
<text x="180" y="381" text-anchor="middle" class="txt">Workload OU and SCP</text>
<text x="180" y="406" text-anchor="middle" class="small">Disabled by default · opt-in only</text>

<!-- LANDING ZONE ACCOUNT -->
<g filter="url(#shadow)"><rect x="360" y="125" width="1200" height="585" rx="22" fill="#fff" stroke="#88b8dd" stroke-width="2"/></g>
<text x="400" y="165" class="panelTitle">Landing Zone Account</text>
<text x="400" y="191" class="panelSub">SECURE ACCOUNT BASELINE BEFORE APPLICATION WORKLOADS</text>

<!-- NETWORK -->
<g filter="url(#shadow)"><rect x="405" y="225" width="360" height="360" rx="16" fill="#edf7ff" stroke="#a8cae5"/></g>
<text x="585" y="260" text-anchor="middle" class="panelTitle">VPC Foundation</text>
<text x="585" y="284" text-anchor="middle" class="panelSub">MULTI-AZ NETWORK SEGMENTATION</text>
<rect x="445" y="325" width="125" height="92" rx="14" fill="#4b9b55"/><text x="507" y="360" text-anchor="middle" class="icon">PUBLIC</text><text x="507" y="385" text-anchor="middle" class="icon">SUBNETS</text>
<rect x="600" y="325" width="125" height="92" rx="14" fill="#1976c9"/><text x="662" y="360" text-anchor="middle" class="icon">PRIVATE</text><text x="662" y="385" text-anchor="middle" class="icon">SUBNETS</text>
<text x="585" y="455" text-anchor="middle" class="svc">Controlled Routing</text>
<text x="585" y="482" text-anchor="middle" class="txt">Public/private tiers across AZs</text>
<rect x="500" y="510" width="170" height="52" rx="12" fill="#4b9b55"/><text x="585" y="542" text-anchor="middle" class="icon">S3 GATEWAY ENDPOINT</text>

<!-- AUDIT -->
<g filter="url(#shadow)"><rect x="805" y="225" width="320" height="360" rx="16" fill="#fff7e8" stroke="#e4c88a"/></g>
<text x="965" y="260" text-anchor="middle" class="panelTitle">Central Audit Logging</text>
<text x="965" y="284" text-anchor="middle" class="panelSub">PRIVATE · VERSIONED · ENCRYPTED</text>
<rect x="855" y="325" width="100" height="88" rx="14" fill="#cf2f7e"/><text x="905" y="362" text-anchor="middle" class="icon">CLOUD</text><text x="905" y="387" text-anchor="middle" class="icon">TRAIL</text>
<rect x="985" y="325" width="100" height="88" rx="14" fill="#4b9b55"/><text x="1035" y="375" text-anchor="middle" class="icon">S3</text>
<path class="arrow" d="M955 369H975"/>
<text x="965" y="455" text-anchor="middle" class="svc">Multi-Region Audit Trail</text>
<text x="965" y="482" text-anchor="middle" class="txt">Log-file validation enabled</text>
<rect x="895" y="510" width="140" height="52" rx="12" fill="#d9344a"/><text x="965" y="542" text-anchor="middle" class="icon">AWS KMS</text>

<!-- SECURITY -->
<g filter="url(#shadow)"><rect x="1165" y="225" width="350" height="360" rx="16" fill="#eefaf4" stroke="#a8d9bf"/></g>
<text x="1340" y="260" text-anchor="middle" class="panelTitle">Security Baseline</text>
<text x="1340" y="284" text-anchor="middle" class="panelSub">DETECTION · POSTURE · ENCRYPTION</text>
<rect x="1205" y="325" width="120" height="82" rx="14" fill="#d9344a"/><text x="1265" y="375" text-anchor="middle" class="icon">GUARDDUTY</text>
<rect x="1355" y="325" width="120" height="82" rx="14" fill="#9c43cf"/><text x="1415" y="362" text-anchor="middle" class="icon">SECURITY</text><text x="1415" y="386" text-anchor="middle" class="icon">HUB</text>
<text x="1340" y="455" text-anchor="middle" class="svc">Account-Level Protection</text>
<text x="1340" y="482" text-anchor="middle" class="txt">GuardDuty + Security Hub</text>
<rect x="1205" y="510" width="120" height="52" rx="12" fill="#3557cc"/><text x="1265" y="542" text-anchor="middle" class="icon">EBS ENC</text>
<rect x="1355" y="510" width="120" height="52" rx="12" fill="#25374a"/><text x="1415" y="542" text-anchor="middle" class="icon">IAM POLICY</text>

<!-- ARROWS -->
<path class="arrow" d="M320 285H350"/><text x="335" y="268" text-anchor="middle" class="small">Optional</text>
<path class="dash" d="M765 405H795"/><path class="dash" d="M1125 405H1155"/>

<!-- AUTOMATION -->
<g filter="url(#shadow)"><rect x="180" y="745" width="1240" height="110" rx="18" fill="#0d2c4b"/></g>
<text x="235" y="785" class="icon">Terraform + GitHub Actions</text>
<text x="235" y="818" font-family="Arial,sans-serif" font-size="17" fill="#dce9f5">Reusable IaC · terraform fmt · terraform init -backend=false · terraform validate · manual environment-specific apply</text>
<rect x="1125" y="770" width="240" height="54" rx="14" fill="#3557cc"/><text x="1245" y="803" text-anchor="middle" class="icon">REVIEWABLE LANDING ZONE CODE</text>

<rect x="180" y="865" width="1240" height="1" fill="#b8cad8" opacity="0"/>
</svg>