<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">AWS Bedrock RAG Assistant AWS Architecture</title>
<desc id="desc">AWS service-oriented architecture for a Bedrock RAG assistant showing optional production web entry through WAF, Cognito, API Gateway and Lambda, then Bedrock Knowledge Bases with S3, vector store, foundation model, IAM, KMS, Guardrails and CloudWatch.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061522"/><stop offset="1" stop-color="#02101b"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b243a"/><stop offset="1" stop-color="#071a2b"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#67baff"/></marker>
 <style>.t{font-family:Arial,Helvetica,sans-serif;fill:#f6fbff}.m{font-family:Arial,Helvetica,sans-serif;fill:#a9c5db}.h{font-weight:700}.panel{fill:url(#panel);stroke:#26506f;stroke-width:1.6}.soft{fill:#0a2032;stroke:#315e80;stroke-width:1.4}.line{stroke:#67baff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6c96b9;stroke-width:2.2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}.small{font-size:14px}.tiny{font-size:12px}.cap{font-size:13px;letter-spacing:2px;fill:#73c1ff}</style>
</defs>
<rect width="1600" height="920" rx="22" fill="url(#bg)"/>
<rect x="24" y="24" width="1552" height="872" rx="22" fill="none" stroke="#173d58" stroke-width="2"/>
<text x="800" y="66" text-anchor="middle" class="t h" font-size="39">AWS Bedrock RAG Assistant – AWS Architecture</text>
<text x="800" y="98" text-anchor="middle" class="m" font-size="18">Production-ready RAG reference architecture using AWS services</text>

<!-- Optional frontend lane -->
<text x="90" y="152" class="cap">OPTIONAL PRODUCTION ENTRY LAYER</text>
<g transform="translate(70 180)">
 <rect width="170" height="170" rx="15" class="panel" filter="url(#shadow)"/>
 <circle cx="85" cy="58" r="28" fill="#315b7d"/><path d="M52 108c4-39 62-39 66 0Z" fill="#315b7d"/>
 <text x="85" y="138" text-anchor="middle" class="t h" font-size="17">User / Web App</text>
</g>
<g transform="translate(290 180)">
 <rect width="170" height="170" rx="15" class="panel" filter="url(#shadow)"/>
 <rect x="51" y="28" width="68" height="68" rx="10" fill="#DD344C"/>
 <path d="M66 79l19-39 19 39M61 79h48" fill="none" stroke="#fff" stroke-width="3"/>
 <text x="85" y="126" text-anchor="middle" class="t h" font-size="17">AWS WAF</text><text x="85" y="148" text-anchor="middle" class="m tiny">Rate limiting / filtering</text>
</g>
<g transform="translate(510 180)">
 <rect width="170" height="170" rx="15" class="panel" filter="url(#shadow)"/>
 <rect x="51" y="28" width="68" height="68" rx="10" fill="#DD344C"/>
 <circle cx="85" cy="52" r="12" fill="none" stroke="#fff" stroke-width="3"/><path d="M66 83c3-24 35-24 38 0" fill="none" stroke="#fff" stroke-width="3"/>
 <text x="85" y="126" text-anchor="middle" class="t h" font-size="17">Amazon Cognito</text><text x="85" y="148" text-anchor="middle" class="m tiny">Authentication</text>
</g>
<g transform="translate(730 180)">
 <rect width="170" height="170" rx="15" class="panel" filter="url(#shadow)"/>
 <rect x="51" y="28" width="68" height="68" rx="10" fill="#8C4FFF"/>
 <path d="M67 48h36v30H67zM60 58h7m36 0h7m-43 20h36" stroke="#fff" stroke-width="3" fill="none"/>
 <text x="85" y="126" text-anchor="middle" class="t h" font-size="16">Amazon API Gateway</text><text x="85" y="148" text-anchor="middle" class="m tiny">HTTPS entry point</text>
</g>
<g transform="translate(950 180)">
 <rect width="170" height="170" rx="15" class="panel" filter="url(#shadow)"/>
 <rect x="51" y="28" width="68" height="68" rx="10" fill="#ED7100"/>
 <path d="M66 82l17-39 14 29h13l-21 13-9-14-7 14z" fill="none" stroke="#fff" stroke-width="3.4"/>
 <text x="85" y="126" text-anchor="middle" class="t h" font-size="17">AWS Lambda</text><text x="85" y="148" text-anchor="middle" class="m tiny">Application orchestration</text>
</g>
<path d="M240 265H290" class="line"/><path d="M460 265H510" class="line"/><path d="M680 265H730" class="line"/><path d="M900 265H950" class="line"/>

<!-- Core Bedrock lane -->
<text x="90" y="430" class="cap">CORE RAG SERVICES</text>
<g transform="translate(120 460)">
 <rect width="300" height="245" rx="16" class="panel" filter="url(#shadow)"/>
 <rect x="112" y="25" width="76" height="76" rx="11" fill="#08A69B"/>
 <path d="M130 43l20-12 20 12v38l-20 12-20-12zM139 43v38m22-38v38m-31-19h40" stroke="#fff" stroke-width="3" fill="none"/>
 <text x="150" y="130" text-anchor="middle" class="t h" font-size="19">Amazon Bedrock</text>
 <text x="150" y="155" text-anchor="middle" class="m small">Agent Runtime</text>
 <text x="150" y="181" text-anchor="middle" class="m tiny">RetrieveAndGenerate</text>
 <text x="150" y="207" text-anchor="middle" class="m tiny">Foundation model inference</text>
</g>

<g transform="translate(495 440)">
 <rect width="520" height="285" rx="16" class="panel" filter="url(#shadow)"/>
 <text x="260" y="38" text-anchor="middle" class="t h" font-size="20">Amazon Bedrock Knowledge Bases</text>
 <text x="260" y="62" text-anchor="middle" class="m small">Managed retrieval over synchronized enterprise content</text>
 <rect x="42" y="92" width="180" height="150" rx="12" class="soft"/>
 <rect x="97" y="110" width="70" height="70" rx="10" fill="#7AA116"/>
 <ellipse cx="132" cy="128" rx="19" ry="7" fill="none" stroke="#fff" stroke-width="3"/><path d="M113 128v31c0 9 38 9 38 0v-31" fill="none" stroke="#fff" stroke-width="3"/>
 <text x="132" y="205" text-anchor="middle" class="t h" font-size="16">Amazon S3</text><text x="132" y="226" text-anchor="middle" class="m tiny">Approved documents</text>
 <rect x="298" y="92" width="180" height="150" rx="12" class="soft"/>
 <rect x="353" y="110" width="70" height="70" rx="10" fill="#8C4FFF"/>
 <circle cx="385" cy="142" r="14" fill="none" stroke="#fff" stroke-width="3"/><path d="M395 152l13 13" stroke="#fff" stroke-width="3"/>
 <text x="388" y="205" text-anchor="middle" class="t h" font-size="16">Vector Store</text><text x="388" y="226" text-anchor="middle" class="m tiny">Managed / supported backend</text>
 <path d="M222 166H298" class="dash"/>
</g>

<g transform="translate(1090 460)">
 <rect width="300" height="245" rx="16" class="panel" filter="url(#shadow)"/>
 <rect x="112" y="25" width="76" height="76" rx="11" fill="#08A69B"/>
 <path d="M128 48c17-20 40-20 44 0m-44 31c17 20 40 20 44 0M150 37v53M137 57h26M137 70h26" stroke="#fff" stroke-width="3" fill="none"/>
 <text x="150" y="130" text-anchor="middle" class="t h" font-size="19">Foundation Model</text>
 <text x="150" y="155" text-anchor="middle" class="m small">Generates grounded answer</text>
 <text x="150" y="181" text-anchor="middle" class="m tiny">Configured model / inference profile</text>
 <rect x="72" y="205" width="156" height="30" rx="7" fill="#113a56"/><text x="150" y="225" text-anchor="middle" class="m tiny">Answer + source references</text>
</g>

<path d="M1120 350V582H420" class="line"/>
<path d="M420 582H495" class="line"/><path d="M1015 582H1090" class="line"/>

<!-- controls -->
<text x="90" y="790" class="cap">SECURITY &amp; OPERATIONS CONTROLS</text>
<g transform="translate(120 815)"><rect width="245" height="70" rx="12" class="soft"/><rect x="16" y="13" width="44" height="44" rx="8" fill="#DD344C"/><path d="M25 40h26v14H25zM30 40V31c0-11 16-11 16 0v9" fill="none" stroke="#fff" stroke-width="2.5"/><text x="76" y="34" class="t h" font-size="15">AWS IAM</text><text x="76" y="54" class="m tiny">Least privilege</text></g>
<g transform="translate(400 815)"><rect width="245" height="70" rx="12" class="soft"/><rect x="16" y="13" width="44" height="44" rx="8" fill="#DD344C"/><text x="38" y="42" text-anchor="middle" class="t h" font-size="15">KMS</text><text x="76" y="34" class="t h" font-size="15">AWS KMS</text><text x="76" y="54" class="m tiny">Encryption controls</text></g>
<g transform="translate(680 815)"><rect width="245" height="70" rx="12" class="soft"/><rect x="16" y="13" width="44" height="44" rx="8" fill="#D82B78"/><path d="M25 44l8-9 8 5 9-14" stroke="#fff" stroke-width="2.5" fill="none"/><text x="76" y="34" class="t h" font-size="15">Amazon CloudWatch</text><text x="76" y="54" class="m tiny">Logs &amp; monitoring</text></g>
<g transform="translate(960 815)"><rect width="245" height="70" rx="12" class="soft"/><rect x="16" y="13" width="44" height="44" rx="8" fill="#8C4FFF"/><path d="M25 25h26v26H25zM30 33h16M30 41h16" stroke="#fff" stroke-width="2.5" fill="none"/><text x="76" y="34" class="t h" font-size="15">Bedrock Guardrails</text><text x="76" y="54" class="m tiny">Optional policy controls</text></g>
<g transform="translate(1240 815)"><rect width="245" height="70" rx="12" class="soft"/><rect x="16" y="13" width="44" height="44" rx="8" fill="#2f6cab"/><path d="M25 48h26M30 30h16M30 38h16" stroke="#fff" stroke-width="2.5"/><text x="76" y="34" class="t h" font-size="15">Output Validation</text><text x="76" y="54" class="m tiny">Deterministic checks</text></g>
</svg>