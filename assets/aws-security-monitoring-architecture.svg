<g filter="url(#shadow)"><rect x="120" y="675" width="1360" height="145" rx="18" fill="#fff" stroke="#b7cee3"/></g>
<text x="160" y="710" class="panelTitle">Security, Encryption &amp; DevSecOps Controls</text>
<g transform="translate(225 735)"><rect width="220" height="60" rx="14" fill="#dc3150"/><text x="110" y="37" text-anchor="middle" class="supportTitle">AWS KMS Encryption</text></g>
<g transform="translate(525 735)"><rect width="220" height="60" rx="14" fill="#3557cc"/><text x="110" y="37" text-anchor="middle" class="supportTitle">Terraform IaC</text></g>
<g transform="translate(825 735)"><rect width="220" height="60" rx="14" fill="#25374a"/><text x="110" y="37" text-anchor="middle" class="supportTitle">GitHub Actions</text></g>
<g transform="translate(1125 735)"><rect width="220" height="60" rx="14" fill="#148f69"/><text x="110" y="37" text-anchor="middle" class="supportTitle">Incident Runbook</text></g>

<rect x="120" y="840" width="1360" height="38" rx="11" fill="#0b2d50"/>
<text x="800" y="865" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#d9e8f6">Reference implementation: Terraform and CI validation are implemented; this portfolio page does not claim a currently deployed production stack.</text>
