<rect x="850" y="255" width="105" height="120" rx="18" fill="#d83569"/><text x="902" y="310" text-anchor="middle" class="icon">SECURITY</text><text x="902" y="339" text-anchor="middle" class="icon">HUB</text>
<text x="902" y="415" text-anchor="middle" class="svc">Security Hub</text>
<text x="902" y="446" text-anchor="middle" class="txt">Finding aggregation</text>
<text x="902" y="472" text-anchor="middle" class="small">HIGH / CRITICAL</text>
<path class="arrow" d="M830 315H840"/>

<!-- ROUTING -->
<g filter="url(#shadow)"><rect x="1030" y="150" width="260" height="470" rx="16" fill="#fff" stroke="#b7cee3"/></g>
<text x="1160" y="188" text-anchor="middle" class="panelTitle">Alert Routing</text>
<text x="1160" y="213" text-anchor="middle" class="panelSub">FILTER · ENCRYPT · NOTIFY</text>
<rect x="1097" y="255" width="126" height="120" rx="18" fill="#e94a8b"/><text x="1160" y="309" text-anchor="middle" class="icon">EVENT</text><text x="1160" y="338" text-anchor="middle" class="icon">BRIDGE</text>
<text x="1160" y="415" text-anchor="middle" class="svc">Amazon EventBridge</text>
<text x="1160" y="446" text-anchor="middle" class="txt">Finding filters</text>
