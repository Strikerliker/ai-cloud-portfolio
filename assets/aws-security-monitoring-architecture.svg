<g transform="translate(310 145)">
  <rect width="315" height="500" rx="18" class="panel" filter="url(#shadow)"/>
  <circle cx="38" cy="38" r="20" fill="#1bb96b"/><text x="38" y="45" text-anchor="middle" class="t h" font-size="19">2</text>
  <text x="72" y="44" class="t h" font-size="19">Audit &amp; Investigation</text>
