<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AWS Security Monitoring Platform Architecture</title>
<desc id="desc">AWS security monitoring reference architecture showing workloads feeding CloudTrail and GuardDuty, encrypted S3 audit storage, Athena threat hunting, Security Hub aggregation, EventBridge routing, encrypted SNS alerts, and security operations response, with KMS, Terraform, and GitHub Actions supporting controls.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324d" flood-opacity=".16"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#1c5b91"/></marker>
  <style>
    .title{font:700 42px Arial,sans-serif;fill:#0b2145}.subtitle{font:18px Arial,sans-serif;fill:#58708a;letter-spacing:4px}.panelTitle{font:700 23px Arial,sans-serif;fill:#0e2d56}.panelSub{font:13px Arial,sans-serif;fill:#668099;letter-spacing:.4px}.svc{font:700 20px Arial,sans-serif;fill:#102d56}.txt{font:16px Arial,sans-serif;fill:#536d86}.small{font:14px Arial,sans-serif;fill:#6b8399}.icon{font:700 20px Arial,sans-serif;fill:#fff}.arrow{stroke:#1c5b91;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#6d7fc7;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}.supportTitle{font:700 18px Arial,sans-serif;fill:#fff}.supportText{font:15px Arial,sans-serif;fill:#536d86}
  </style>
</defs>
<rect width="1600" height="900" fill="#f6f9fc"/>
<text x="800" y="55" text-anchor="middle" class="title">AWS Security Monitoring Platform</text>
<text x="800" y="88" text-anchor="middle" class="subtitle">AUDIT | DETECT | AGGREGATE | ROUTE | INVESTIGATE | RESPOND</text>

<!-- SOURCE -->
<g filter="url(#shadow)"><rect x="40" y="150" width="190" height="470" rx="16" fill="#fff" stroke="#b7cee3"/></g>
<text x="135" y="188" text-anchor="middle" class="panelTitle">AWS Environment</text>
<circle cx="135" cy="278" r="52" fill="#1f5f9f"/><text x="135" y="286" text-anchor="middle" class="icon">AWS</text>
<text x="135" y="366" text-anchor="middle" class="svc">Accounts &amp;</text>
<text x="135" y="392" text-anchor="middle" class="svc">Workloads</text>
<text x="135" y="440" text-anchor="middle" class="txt">API activity</text>
<text x="135" y="468" text-anchor="middle" class="txt">Identity events</text>
<text x="135" y="496" text-anchor="middle" class="txt">Workload signals</text>
<text x="135" y="550" text-anchor="middle" class="small">Security telemetry source</text>

<!-- AUDIT -->
<g filter="url(#shadow)"><rect x="275" y="150" width="350" height="470" rx="16" fill="#fff" stroke="#b7cee3"/></g>
<text x="450" y="188" text-anchor="middle" class="panelTitle">Audit &amp; Investigation</text>
<text x="450" y="213" text-anchor="middle" class="panelSub">CENTRALIZED ACTIVITY LOGGING</text>
<rect x="320" y="255" width="125" height="120" rx="18" fill="#4b7fd7"/><text x="382" y="307" text-anchor="middle" class="icon">CLOUD</text><text x="382" y="336" text-anchor="middle" class="icon">TRAIL</text>
<text x="382" y="415" text-anchor="middle" class="svc">AWS CloudTrail</text>
<text x="382" y="446" text-anchor="middle" class="txt">Multi-Region events</text>
<text x="382" y="472" text-anchor="middle" class="small">Log-file validation</text>
<rect x="470" y="255" width="120" height="120" rx="18" fill="#55951a"/><text x="530" y="322" text-anchor="middle" class="icon">S3</text>
<text x="530" y="415" text-anchor="middle" class="svc">Amazon S3</text>
<text x="530" y="446" text-anchor="middle" class="txt">Encrypted log archive</text>
<text x="530" y="472" text-anchor="middle" class="small">Versioned · private</text>
