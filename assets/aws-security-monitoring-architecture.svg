<text x="1445" y="438" text-anchor="middle" class="txt">Investigate</text>
<text x="1445" y="466" text-anchor="middle" class="txt">Contain</text>
<text x="1445" y="494" text-anchor="middle" class="txt">Recover</text>
<text x="1445" y="548" text-anchor="middle" class="small">Runbook-driven workflow</text>

<!-- FLOWS -->
<path class="arrow" d="M230 300H310"/>
<path class="arrow" d="M230 355H700"/>
<path class="arrow" d="M990 315H1087"/>
<path class="arrow" d="M1223 546H1320"/>
