<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AWS Security Monitoring Platform – AWS Architecture</title>
<desc id="desc">Reference AWS security monitoring architecture showing AWS accounts and workloads feeding CloudTrail and GuardDuty, centralized S3 logging and Athena investigation, Security Hub aggregation, EventBridge and SNS alert routing, and security operations response with IAM, KMS, Terraform, GitHub Actions, and an incident runbook.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182a"/><stop offset="1" stop-color="#03111e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b263f"/><stop offset="1" stop-color="#081c30"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".26"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#72bfff"/></marker>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#f5fbff}.m{font-family:Arial,Helvetica,sans-serif;fill:#a9c5db}.h{font-weight:700}
    .panel{fill:url(#panel);stroke:#2b5c82;stroke-width:1.6}.line{stroke:#72bfff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6e99bd;stroke-width:2.2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    .small{font-size:14px}.tiny{font-size:12px}.cap{font-size:13px;letter-spacing:2px;fill:#78c4ff}
  </style>
</defs>

<rect width="1600" height="900" rx="24" fill="url(#bg)"/>
<text x="800" y="58" text-anchor="middle" class="t h" font-size="40">AWS Security Monitoring Platform – AWS Architecture</text>
<text x="800" y="90" text-anchor="middle" class="m" font-size="18">Centralized audit logging • threat detection • finding aggregation • alert routing • security operations</text>

<!-- 1 environment -->
<g transform="translate(35 145)">
  <rect width="235" height="500" rx="18" class="panel" filter="url(#shadow)"/>
  <circle cx="38" cy="38" r="20" fill="#2f80ed"/><text x="38" y="45" text-anchor="middle" class="t h" font-size="19">1</text>
  <text x="72" y="44" class="t h" font-size="19">AWS Environment</text>
  <text x="72" y="66" class="m small">Accounts &amp; workloads</text>
  <circle cx="118" cy="150" r="48" fill="#1c5d97"/>
  <path d="M78 151c5-31 49-40 68-13 25-7 43 26 24 43H88c-23 0-29-27-10-30z" fill="none" stroke="#fff" stroke-width="3.5"/>
  <path d="M95 174l23-13 23 13-23 13zM95 174v25l23 13 23-13v-25M118 187v25" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="118" y="234" text-anchor="middle" class="t h" font-size="16">AWS Accounts</text>
  <text x="118" y="262" text-anchor="middle" class="m small">Workloads &amp; apps</text>
  <text x="118" y="286" text-anchor="middle" class="m small">AWS services</text>
  <text x="118" y="310" text-anchor="middle" class="m small">API activity</text>
  <text x="118" y="334" text-anchor="middle" class="m small">Identity events</text>
  <text x="118" y="358" text-anchor="middle" class="m small">Security telemetry</text>
  <rect x="25" y="410" width="185" height="58" rx="10" fill="#0a3554"/>
  <text x="118" y="435" text-anchor="middle" class="m tiny">Generates logs, findings,</text>
  <text x="118" y="454" text-anchor="middle" class="m tiny">and security events</text>
</g>

