  <rect width="265" height="500" rx="18" class="panel" filter="url(#shadow)"/>
  <circle cx="38" cy="38" r="20" fill="#11b7c4"/><text x="38" y="45" text-anchor="middle" class="t h" font-size="19">5</text>
  <text x="72" y="44" class="t h" font-size="19">Security Operations</text>
