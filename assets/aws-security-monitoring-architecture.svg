<rect x="1097" y="510" width="126" height="72" rx="14" fill="#c9348a"/><text x="1160" y="553" text-anchor="middle" class="icon">SNS</text>
<text x="1160" y="605" text-anchor="middle" class="small">Encrypted alert topic</text>
<path class="arrow" d="M1160 375V495"/>

<!-- RESPONSE -->
<g filter="url(#shadow)"><rect x="1330" y="150" width="230" height="470" rx="16" fill="#fff" stroke="#b7cee3"/></g>
