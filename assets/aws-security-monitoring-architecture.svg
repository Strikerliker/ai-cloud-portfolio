<rect x="375" y="515" width="150" height="68" rx="14" fill="#7a43d8"/><text x="450" y="555" text-anchor="middle" class="icon">ATHENA</text>
<text x="450" y="603" text-anchor="middle" class="small">Threat-hunting SQL queries</text>
<path class="arrow" d="M530 375V500H490"/>

