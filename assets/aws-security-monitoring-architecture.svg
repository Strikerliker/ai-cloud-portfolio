  <text x="221" y="267" text-anchor="middle" class="m tiny">Aggregate findings</text>
  <text x="221" y="285" text-anchor="middle" class="m tiny">security posture</text>

  <path d="M127 166H175" class="line"/>
</g>

<!-- 4 route -->
<g transform="translate(1005 145)">
  <rect width="255" height="500" rx="18" class="panel" filter="url(#shadow)"/>
  <circle cx="38" cy="38" r="20" fill="#8C4FFF"/><text x="38" y="45" text-anchor="middle" class="t h" font-size="19">4</text>
  <text x="72" y="44" class="t h" font-size="19">Alert Routing</text>
