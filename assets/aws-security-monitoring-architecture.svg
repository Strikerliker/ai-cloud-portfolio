<rect x="710" y="255" width="120" height="120" rx="18" fill="#e44b3f"/><text x="770" y="310" text-anchor="middle" class="icon">GUARD</text><text x="770" y="339" text-anchor="middle" class="icon">DUTY</text>
<text x="770" y="415" text-anchor="middle" class="svc">Amazon GuardDuty</text>
<text x="770" y="446" text-anchor="middle" class="txt">Threat detection</text>
