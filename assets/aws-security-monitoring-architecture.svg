  <text x="76" y="242" text-anchor="middle" class="m tiny">API &amp; account activity</text>

  <rect x="195" y="110" width="82" height="82" rx="11" fill="#7AA116"/>
  <ellipse cx="236" cy="132" rx="23" ry="8" fill="none" stroke="#fff" stroke-width="3"/><path d="M213 132v38c0 10 46 10 46 0v-38" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="236" y="220" text-anchor="middle" class="t h" font-size="16">Amazon S3</text>
  <text x="236" y="242" text-anchor="middle" class="m tiny">Centralized log archive</text>

  <path d="M117 151H195" class="line"/>

  <rect x="118" y="330" width="82" height="82" rx="11" fill="#8C4FFF"/>
  <circle cx="159" cy="367" r="18" fill="none" stroke="#fff" stroke-width="3"/><path d="M171 379l15 15M147 367h24M159 355v24" stroke="#fff" stroke-width="3"/>
  <text x="159" y="440" text-anchor="middle" class="t h" font-size="16">Amazon Athena</text>
  <text x="159" y="462" text-anchor="middle" class="m tiny">Threat-hunting SQL</text>
  <path d="M236 242V288H159V330" class="dash"/>
</g>

<!-- 3 detect -->
<g transform="translate(665 145)">
  <rect width="300" height="500" rx="18" class="panel" filter="url(#shadow)"/>
