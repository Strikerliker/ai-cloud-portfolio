<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI Document Processing Pipeline - AWS Serverless AI Architecture</title>
<desc id="desc">AWS serverless document processing architecture showing document upload to Amazon S3, EventBridge routing, Step Functions orchestration, asynchronous Amazon Textract extraction, Lambda processing, Amazon Bedrock enrichment, S3 structured output, CloudWatch logging, IAM controls, Terraform, and GitHub Actions validation.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#16324e" flood-opacity=".16"/></filter>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#1b5f94"/></marker>
  <style>
    .h1{font:700 42px Arial,sans-serif;fill:#0b2145}.sub{font:18px Arial,sans-serif;fill:#58708a;letter-spacing:4px}.section{font:700 23px Arial,sans-serif;fill:#0e2d56}.sectionSub{font:13px Arial,sans-serif;fill:#647e96;letter-spacing:.4px}.svc{font:700 19px Arial,sans-serif;fill:#102d56}.txt{font:15px Arial,sans-serif;fill:#526b84}.small{font:13px Arial,sans-serif;fill:#6d8398}.icon{font:700 20px Arial,sans-serif;fill:white}.support{font:700 17px Arial,sans-serif;fill:white}.arrow{stroke:#1b5f94;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#7a84c6;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
  </style>
</defs>
