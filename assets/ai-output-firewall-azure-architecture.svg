<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">AI Output Firewall – Microsoft Azure Architecture</title>
<desc id="desc">Logical Microsoft Azure architecture for an AI output quality and hallucination firewall. The diagram groups services by architectural domain inside an Azure subscription and resource group rather than presenting a process flow.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#eaf5ff"/></linearGradient>
  <linearGradient id="sub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f3f9fe"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#002b55" flood-opacity=".14"/></filter>
  <style>
    .txt{font-family:Segoe UI,Arial,sans-serif;fill:#12395f}.muted{font-family:Segoe UI,Arial,sans-serif;fill:#54789b}
    .h1{font:700 39px 'Segoe UI',Arial,sans-serif;fill:#11345b}.h2{font:700 23px 'Segoe UI',Arial,sans-serif;fill:#12395f}
    .h3{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#12395f}.svc{font:700 14px 'Segoe UI',Arial,sans-serif;fill:#12395f}
    .sm{font:13px 'Segoe UI',Arial,sans-serif;fill:#54789b}.tiny{font:11px 'Segoe UI',Arial,sans-serif;fill:#6685a3}
    .boundary{fill:url(#sub);stroke:#178fd3;stroke-width:2}.rg{fill:none;stroke:#52aee1;stroke-width:1.6;stroke-dasharray:8 6}
    .domain{stroke-width:1.5}.card{fill:#fff;stroke:#b8d6ec;stroke-width:1.2}
    .rel{stroke:#7b98b5;stroke-width:2.2;fill:none}.dash{stroke:#7b98b5;stroke-width:1.8;fill:none;stroke-dasharray:7 6}
  </style>
</defs>

<rect width="1600" height="980" fill="url(#bg)"/>

<!-- Header -->
<g transform="translate(42 25)">
  <path d="M0 47L22 5l22 42H32L22 29 12 47z" fill="#0078D4"/>
  <text x="60" y="37" class="h2">Microsoft Azure</text>
</g>
<text x="800" y="62" text-anchor="middle" class="h1">AI Output Quality &amp; Hallucination Firewall</text>
<text x="800" y="94" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#0078D4">Microsoft Azure Reference Architecture</text>
<text x="800" y="120" text-anchor="middle" class="sm">Logical service architecture for evidence-grounded AI verification — grouped by architectural domain, not process sequence</text>

<!-- External users -->
<g transform="translate(35 330)" filter="url(#shadow)">
  <rect width="185" height="250" rx="18" class="card" stroke="#178fd3"/>
  <text x="92" y="34" text-anchor="middle" class="h3">Consumers</text>
  <rect x="44" y="70" width="96" height="62" rx="8" fill="none" stroke="#2c78aa" stroke-width="3"/>
  <path d="M36 139h112" stroke="#2c78aa" stroke-width="3"/>
  <rect x="79" y="158" width="28" height="48" rx="4" fill="none" stroke="#2c78aa" stroke-width="3"/>
  <text x="92" y="227" text-anchor="middle" class="sm">Web / app clients</text>
</g>

<!-- Subscription -->
<rect x="245" y="155" width="1320" height="750" rx="24" class="boundary" filter="url(#shadow)"/>
<text x="278" y="194" class="h2" fill="#0078D4">Azure Subscription</text>

<!-- Resource group -->
<rect x="270" y="215" width="1270" height="655" rx="20" class="rg"/>
<g transform="translate(292 232)">
  <path d="M0 10l12-7 12 7v14l-12 7-12-7z" fill="none" stroke="#0078D4" stroke-width="2"/>
  <text x="38" y="22" class="h3">Resource Group: ai-output-firewall-rg</text>
</g>

<!-- Domain 1 -->
<g>
  <rect x="300" y="285" width="360" height="250" rx="18" fill="#0078D4" fill-opacity=".07" stroke="#0078D4" class="domain"/>
  <text x="325" y="320" class="h3">Ingress &amp; API Boundary</text>
  <text x="325" y="343" class="sm">Controlled public entry and API policy enforcement</text>

  <!-- App Gateway -->
  <g transform="translate(330 375)">
    <rect width="135" height="125" rx="14" class="card"/>
    <circle cx="67" cy="42" r="28" fill="#0078D4"/>
    <path d="M48 44c4-16 27-25 40-7 13 1 18 19 7 27H47c-12-3-14-16 1-20z" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="67" y="92" text-anchor="middle" class="svc">Application</text>
    <text x="67" y="110" text-anchor="middle" class="svc">Gateway</text>
  </g>

  <!-- API Management -->
  <g transform="translate(495 375)">
    <rect width="135" height="125" rx="14" class="card"/>
    <circle cx="67" cy="42" r="28" fill="#0078D4"/>
    <path d="M47 32h40v28H47zM55 39l-6 7 6 7M79 39l6 7-6 7" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="67" y="92" text-anchor="middle" class="svc">API</text>
    <text x="67" y="110" text-anchor="middle" class="svc">Management</text>
  </g>
</g>

<!-- Domain 2 -->
<g>
  <rect x="690" y="285" width="430" height="250" rx="18" fill="#7B61FF" fill-opacity=".07" stroke="#7B61FF" class="domain"/>
  <text x="715" y="320" class="h3">Application &amp; AI Runtime</text>
  <text x="715" y="343" class="sm">Serverless verification logic and foundation-model access</text>

  <!-- Functions -->
  <g transform="translate(725 375)">
    <rect width="150" height="125" rx="14" class="card"/>
    <circle cx="75" cy="42" r="28" fill="#0078D4"/>
    <path d="M77 18L55 53h17l-8 23 31-38H78l10-20z" fill="#FFD23F"/>
    <text x="75" y="100" text-anchor="middle" class="svc">Azure Functions</text>
  </g>

  <!-- OpenAI -->
  <g transform="translate(930 375)">
    <rect width="155" height="125" rx="14" class="card"/>
    <circle cx="78" cy="42" r="28" fill="#0078D4"/>
    <path d="M64 30c8-10 23-5 24 7 10 2 12 16 2 21-2 11-16 15-24 7-11 3-18-9-12-18-5-9 1-18 10-17z" fill="none" stroke="#fff" stroke-width="2.5"/>
    <text x="78" y="100" text-anchor="middle" class="svc">Azure OpenAI</text>
  </g>
</g>

<!-- Domain 3 -->
<g>
  <rect x="1150" y="285" width="360" height="250" rx="18" fill="#00A86B" fill-opacity=".07" stroke="#00A86B" class="domain"/>
  <text x="1175" y="320" class="h3">Evidence &amp; Audit Data</text>
  <text x="1175" y="343" class="sm">Trusted corpus, retrieval index, and decision records</text>

  <!-- AI Search -->
  <g transform="translate(1180 375)">
    <rect width="135" height="125" rx="14" class="card"/>
    <circle cx="67" cy="42" r="28" fill="#0078D4"/>
    <circle cx="61" cy="38" r="11" fill="none" stroke="#fff" stroke-width="3"/><path d="M69 46l12 12" stroke="#fff" stroke-width="3"/>
    <text x="67" y="92" text-anchor="middle" class="svc">Azure AI</text>
    <text x="67" y="110" text-anchor="middle" class="svc">Search</text>
  </g>

  <!-- Storage -->
  <g transform="translate(1345 375)">
    <rect width="135" height="125" rx="14" class="card"/>
    <circle cx="67" cy="42" r="28" fill="#0078D4"/>
    <path d="M48 31h38v29H48zM55 24h24l7 7H48z" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="67" y="92" text-anchor="middle" class="svc">Blob Storage</text>
    <text x="67" y="110" text-anchor="middle" class="tiny">trusted sources</text>
  </g>
</g>

<!-- Cross cutting -->
<g>
  <rect x="300" y="575" width="380" height="230" rx="18" fill="#F4B400" fill-opacity=".08" stroke="#D79B00" class="domain"/>
  <text x="325" y="610" class="h3">Identity &amp; Secrets</text>
  <text x="325" y="633" class="sm">Access control and secret isolation</text>

  <g transform="translate(330 660)">
    <rect width="100" height="105" rx="12" class="card"/>
    <path d="M50 16l25 25-25 25-25-25z" fill="#0078D4"/>
    <path d="M50 16v50l13-13-13-12 13-13z" fill="#55C2FF"/>
    <text x="50" y="88" text-anchor="middle" class="svc">Entra ID</text>
  </g>
  <g transform="translate(445 660)">
    <rect width="100" height="105" rx="12" class="card"/>
    <circle cx="50" cy="39" r="24" fill="#0078D4"/><text x="50" y="46" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#fff">ID</text>
    <text x="50" y="82" text-anchor="middle" class="svc">Managed</text><text x="50" y="98" text-anchor="middle" class="tiny">Identity</text>
  </g>
  <g transform="translate(560 660)">
    <rect width="90" height="105" rx="12" class="card"/>
    <circle cx="45" cy="39" r="24" fill="#0078D4"/>
    <circle cx="39" cy="36" r="7" fill="none" stroke="#fff" stroke-width="3"/><path d="M46 36h20M57 36v8M63 36v6" stroke="#fff" stroke-width="3"/>
    <text x="45" y="88" text-anchor="middle" class="svc">Key Vault</text>
  </g>
</g>

<g>
  <rect x="710" y="575" width="380" height="230" rx="18" fill="#0F75BC" fill-opacity=".07" stroke="#0F75BC" class="domain"/>
  <text x="735" y="610" class="h3">Observability &amp; Quality Signals</text>
  <text x="735" y="633" class="sm">Telemetry for requests, scoring, policy, and failures</text>

  <g transform="translate(755 660)">
    <rect width="130" height="105" rx="12" class="card"/>
    <circle cx="65" cy="39" r="24" fill="#0078D4"/>
    <path d="M47 46a19 19 0 1 1 36 0M65 39l10-10" fill="none" stroke="#fff" stroke-width="3"/>
    <text x="65" y="88" text-anchor="middle" class="svc">Azure Monitor</text>
  </g>
  <g transform="translate(915 660)">
    <rect width="140" height="105" rx="12" class="card"/>
    <circle cx="70" cy="39" r="24" fill="#0078D4"/>
    <path d="M60 35c0-11 20-11 20 0 0 7-5 9-7 13H67c-2-4-7-6-7-13zM65 54h10" fill="none" stroke="#fff" stroke-width="2.5"/>
    <text x="70" y="82" text-anchor="middle" class="svc">Application</text>
    <text x="70" y="98" text-anchor="middle" class="tiny">Insights</text>
  </g>
</g>

<g>
  <rect x="1120" y="575" width="390" height="230" rx="18" fill="#6F42C1" fill-opacity=".07" stroke="#6F42C1" class="domain"/>
  <text x="1145" y="610" class="h3">Delivery &amp; Infrastructure as Code</text>
  <text x="1145" y="633" class="sm">Source control, validation, and repeatable deployment</text>

  <g transform="translate(1155 660)">
    <rect width="100" height="105" rx="12" class="card"/>
    <circle cx="50" cy="38" r="24" fill="#171717"/><path d="M38 43c-3-10 3-18 12-18s15 8 12 18c-2 7-6 10-12 10s-10-3-12-10z" fill="#fff"/>
    <text x="50" y="88" text-anchor="middle" class="svc">GitHub</text>
  </g>
  <g transform="translate(1270 660)">
    <rect width="105" height="105" rx="12" class="card"/>
    <circle cx="52" cy="38" r="24" fill="#0078D4"/>
    <circle cx="44" cy="34" r="5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="61" cy="47" r="5" fill="none" stroke="#fff" stroke-width="2"/><path d="M48 38l9 6" stroke="#fff" stroke-width="2"/>
    <text x="52" y="82" text-anchor="middle" class="svc">GitHub</text><text x="52" y="98" text-anchor="middle" class="tiny">Actions</text>
  </g>
  <g transform="translate(1390 660)">
    <rect width="90" height="105" rx="12" class="card"/>
    <rect x="22" y="16" width="46" height="46" rx="8" fill="#7B61FF"/><text x="45" y="46" text-anchor="middle" font-family="Segoe UI,Arial" font-size="13" font-weight="700" fill="#fff">IaC</text>
    <text x="45" y="82" text-anchor="middle" class="svc">Terraform</text><text x="45" y="98" text-anchor="middle" class="tiny">/ Bicep</text>
  </g>
</g>

<!-- Architectural relationships: intentionally sparse -->
<path d="M220 455H300" class="rel"/>
<path d="M660 410H690" class="rel"/>
<path d="M1120 410H1150" class="rel"/>
<path d="M500 535V575" class="dash"/>
<path d="M905 535V575" class="dash"/>
<path d="M1325 535V575" class="dash"/>

<!-- Cosmos audit store badge -->
<g transform="translate(1280 505)">
  <ellipse cx="0" cy="0" rx="34" ry="11" fill="none" stroke="#0078D4" stroke-width="2"/>
  <ellipse cx="0" cy="0" rx="11" ry="34" fill="none" stroke="#0078D4" stroke-width="2" transform="rotate(55)"/>
  <circle cx="0" cy="0" r="8" fill="#0078D4"/>
  <text x="50" y="-4" class="svc">Cosmos DB</text><text x="50" y="15" class="tiny">audit decisions</text>
</g>

<text x="800" y="940" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#55789a">ARCHITECTURE VIEW • AZURE SUBSCRIPTION + RESOURCE GROUP + SERVICE DOMAINS • NOT A DATA-FLOW DIAGRAM</text>
</svg>