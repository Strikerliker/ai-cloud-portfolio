<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Project Visual | John D.</title>
<meta name="description" content="Architecture dashboard and project graphic for John D.'s cloud, security, AI, automation, and manufacturing portfolio projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05111d;--panel:#0a2032;--panel2:#0d263b;--line:#1b4562;--text:#f7fbff;--muted:#a9c1d6;--blue:#0799f9;--green:#08d9a2;--purple:#a94dff;--orange:#ff922b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 5%,#0b2b45 0,#061522 30%,#05111d 65%);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 38px));margin:auto}.top{height:78px;border-bottom:1px solid #17384f;background:rgba(5,17,29,.94);display:flex;align-items:center}.topin{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:15px;font-weight:800}.brand img{width:54px;height:45px;object-fit:contain}.back{border:1px solid #2c5877;border-radius:8px;padding:10px 15px;color:#cce4f7}.hero{padding:58px 0 34px}.eyebrow{font-size:12px;letter-spacing:2.2px;color:var(--blue);font-weight:800}.hero h1{font-size:clamp(36px,5vw,62px);line-height:1.02;letter-spacing:-2px;margin:12px 0 18px}.hero p{max-width:850px;color:#c1d2e1;font-size:18px;line-height:1.65;margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:32px 0}.stat{background:linear-gradient(145deg,#0b2235,#081a2a);border:1px solid var(--line);border-radius:12px;padding:20px}.stat small{display:block;color:#7fa7c6;font-weight:700;letter-spacing:1px;margin-bottom:9px}.stat b{font-size:18px}.board{border:1px solid #1c4865;border-radius:16px;background:linear-gradient(160deg,rgba(11,34,53,.96),rgba(6,20,33,.98));padding:28px;box-shadow:0 25px 60px rgba(0,0,0,.25)}.boardhead{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:28px}.board h2{margin:0;font-size:27px}.boardhead span{color:#7fa7c6;font-size:13px}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;align-items:stretch}.node{position:relative;min-height:138px;border:1px solid #23536f;border-radius:12px;padding:18px;background:#0a1e30;display:flex;flex-direction:column;justify-content:center}.node:after{content:'→';position:absolute;right:-22px;top:50%;transform:translateY(-50%);color:#39adf7;font-size:25px;font-weight:800}.node:last-child:after{display:none}.node i{font-style:normal;color:var(--blue);font-weight:800;font-size:11px;letter-spacing:1.3px;margin-bottom:9px}.node strong{font-size:17px;line-height:1.25}.node p{color:#9eb6ca;font-size:13px;line-height:1.45;margin:8px 0 0}.lower{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;margin:22px 0 48px}.card{border:1px solid #1b4562;border-radius:13px;background:#081b2b;padding:24px}.card h3{margin:0 0 15px}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{padding:9px 12px;border:1px solid #255776;background:#0b263a;border-radius:999px;color:#cfe6f7;font-size:13px}.controls{display:grid;gap:12px}.control{display:flex;gap:12px;align-items:flex-start;color:#bfd2e2}.dot{width:10px;height:10px;border-radius:50%;background:var(--green);margin-top:5px;box-shadow:0 0 12px rgba(8,217,162,.5)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 18px;border-radius:8px;border:1px solid var(--blue);font-weight:800}.btn.primary{background:linear-gradient(135deg,#0aa7ff,#0677f5)}.note{color:#789db9;font-size:12px;margin-top:17px}.error{padding:80px 0;text-align:center}.error h1{font-size:42px}.footer{padding:25px 0 40px;color:#7798b2;font-size:13px}@media(max-width:900px){.stats{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.node:after{content:'↓';right:auto;left:50%;top:auto;bottom:-25px;transform:translateX(-50%)}.lower{grid-template-columns:1fr}.boardhead{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.top{height:auto;padding:15px 0}.topin{align-items:flex-start}.brand span{display:none}.hero{padding-top:40px}.board{padding:18px}.wrap{width:min(100% - 24px,1180px)}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin"><a class="brand" href="../index.html#projects"><img src="../assets/jd-logo.svg" alt="JD"><span>AI &amp; AWS Cloud SME</span></a><a class="back" href="../index.html#projects">← Back to Projects</a></div></header>
<main id="app"></main>
<footer class="wrap footer">John D. · Project Architecture Visuals</footer>
<script>
const projects={
'aws-bedrock-rag-assistant':{category:'GENERATIVE AI',title:'AWS Bedrock RAG Assistant',summary:'Secure enterprise-style retrieval-augmented generation architecture that grounds model responses in trusted knowledge instead of relying on model memory alone.',focus:'Grounded enterprise AI',platform:'AWS Bedrock + S3',pattern:'RAG + least privilege',repo:'https://github.com/Strikerliker/aws-bedrock-rag-assistant',nodes:[['SOURCE','Trusted Documents','Approved enterprise knowledge'],['STORE','Amazon S3','Encrypted knowledge corpus'],['RETRIEVE','Bedrock Knowledge Base','Semantic retrieval of relevant context'],['GENERATE','Foundation Model','Answer generation using retrieved context'],['RESPOND','Grounded Answer','Useful response tied to trusted knowledge']],chips:['Amazon Bedrock','Amazon S3','RAG','Vector Retrieval','IAM','Encryption','Guardrails'],controls:['Trusted-source retrieval before generation','Least-privilege access to knowledge and models','Encryption for stored knowledge','Grounded-answer design to reduce hallucination risk']},
'aws-security-monitoring-platform':{category:'CLOUD SECURITY',title:'AWS Security Monitoring Platform',summary:'Centralized AWS security monitoring blueprint combining audit logging, threat detection, posture management, event routing, encrypted notifications, and analyst response workflows.',focus:'Detection & response',platform:'AWS Security Services',pattern:'Centralized monitoring',repo:'https://github.com/Strikerliker/ai-cloud-portfolio/tree/main/projects/aws-security-monitoring-platform',nodes:[['AUDIT','AWS CloudTrail','Account and API activity'],['STORE','Encrypted S3','Durable centralized log retention'],['DETECT','GuardDuty + Security Hub','Threat and posture findings'],['ROUTE','EventBridge + SNS','Security-event routing and notification'],['RESPOND','Security Analyst','Triage, investigation, containment']],chips:['CloudTrail','GuardDuty','Security Hub','EventBridge','SNS','KMS','S3','Terraform'],controls:['Encrypted and versioned audit-log storage','Managed threat detection and security posture findings','Event-driven alert routing','Documented incident-response and threat-hunting workflow']},
'terraform-aws-landing-zone':{category:'INFRASTRUCTURE AS CODE',title:'Terraform AWS Landing Zone',summary:'Reusable landing-zone blueprint for establishing secure AWS foundations with repeatable account governance, identity, networking, logging, and workload guardrails.',focus:'Cloud foundation',platform:'AWS + Terraform',pattern:'Multi-account governance',repo:null,nodes:[['GOVERN','AWS Organizations','Account structure and governance'],['CONTROL','SCPs + IAM','Preventive controls and access boundaries'],['CONNECT','Network Foundation','VPC, routing, segmentation'],['OBSERVE','Central Logging','CloudTrail and security visibility'],['HOST','Workload Accounts','Controlled application environments']],chips:['Terraform','AWS Organizations','IAM','SCPs','VPC','CloudTrail','KMS'],controls:['Infrastructure defined as repeatable code','Separation of governance and workload responsibilities','Centralized logging and encryption patterns','Guardrails designed before workload deployment']},
'ai-document-processing-pipeline':{category:'INTELLIGENT AUTOMATION',title:'AI Document Processing Pipeline',summary:'Serverless document-processing architecture for secure ingestion, text extraction, classification, summarization, and automated downstream actions.',focus:'Document automation',platform:'AWS Serverless + AI',pattern:'Event-driven processing',repo:null,nodes:[['INGEST','Secure Upload','Documents enter controlled storage'],['TRIGGER','Event-Driven Workflow','New files launch processing'],['EXTRACT','Text & Metadata','Document content is extracted'],['UNDERSTAND','AI Classification','Classify, summarize, and structure'],['ACT','Business Workflow','Store results and trigger next actions']],chips:['Amazon S3','AWS Lambda','EventBridge','AI/ML','Bedrock','Encryption','Automation'],controls:['Event-driven processing minimizes persistent compute','Encrypted storage for source and processed documents','Least-privilege service interactions','Human-review points can be added for sensitive workflows']},
'secure-ai-api-deployment':{category:'DEVSECOPS',title:'Secure AI API Deployment',summary:'Production-style AI API blueprint with authenticated ingress, controlled model access, secrets protection, encrypted data paths, observability, and automated deployment controls.',focus:'Secure AI delivery',platform:'AWS API + AI',pattern:'Zero-trust API path',repo:null,nodes:[['CLIENT','Authorized Client','Authenticated application request'],['EDGE','API Gateway + WAF','Request filtering and API control'],['SERVICE','Compute Layer','Validated business logic and policy'],['MODEL','Bedrock / Model API','Controlled AI inference'],['OBSERVE','CloudWatch + Audit','Logs, metrics, alerts, traceability']],chips:['API Gateway','WAF','IAM','AWS Lambda','Bedrock','CloudWatch','KMS','CI/CD'],controls:['Authentication and authorization before model access','Secrets kept out of source code','Encrypted storage and transport patterns','Monitoring and audit visibility around AI requests']},
'hermes-agent-cloud-deployment':{category:'AGENTIC AI',title:'Hermes Agent Cloud Deployment',summary:'Secure cloud-deployment architecture for an agentic AI service with controlled tool execution, model flexibility, persistent memory, and AWS security boundaries.',focus:'Agentic AI',platform:'AWS + Hermes',pattern:'Controlled tool execution',repo:'https://github.com/Strikerliker/hermes-agent-cloud-deployment',nodes:[['USER','Operator / User','Goal or task request'],['AGENT','Hermes Agent','Plans and orchestrates work'],['MODEL','Model Provider','Reasoning and generation'],['TOOLS','Controlled Tools','Approved actions and integrations'],['MEMORY','Persistent Memory','Retained task context and knowledge']],chips:['Hermes','Agentic AI','AWS','Tool Use','Memory','IAM','Secrets Management'],controls:['Tool access can be scoped to approved capabilities','Cloud permissions separated from model logic','Persistent memory isolated from runtime instructions','Secrets and service credentials kept outside prompts']},
'openclaw-private-ai-assistant':{category:'AUTONOMOUS ASSISTANT',title:'OpenClaw Private AI Assistant',summary:'Private AI-assistant architecture emphasizing controlled execution, persistent memory, model access, auditability, and separation between user intent and tool permissions.',focus:'Private assistant',platform:'Private AI + Cloud',pattern:'Permissioned autonomy',repo:'https://github.com/Strikerliker/openclaw-private-ai-assistant',nodes:[['USER','Private User','Task, question, or workflow'],['ASSIST','OpenClaw Assistant','Intent and orchestration layer'],['BROKER','Tool Broker','Permissioned tool execution'],['MODEL','LLM Service','Reasoning and generation'],['AUDIT','Memory + Logs','Persistent context and traceability']],chips:['OpenClaw','Private AI','LLM','Tool Broker','Memory','Audit Logging','Access Control'],controls:['Tool permissions separated from natural-language instructions','Private memory and context handling','Auditable execution trail','Model and tools can be swapped without redesigning the boundary']},
'manufacturing-erp-mrp-sql-reporting':{category:'MANUFACTURING SYSTEMS',title:'Manufacturing ERP/MRP SQL Reporting',summary:'SQL Server reporting architecture for production, inventory, bill of materials, purchasing, suppliers, sales orders, and operational decision support.',focus:'Manufacturing analytics',platform:'SQL Server',pattern:'ERP/MRP reporting',repo:'https://github.com/Strikerliker/manufacturing-erp-mrp-sql-reporting',nodes:[['DATA','ERP / MRP Data','Orders, inventory, BOMs, suppliers'],['MODEL','SQL Server','Relational operational model'],['LOGIC','Views + Queries','Reusable reporting logic'],['REPORT','Operations Dashboard','Production and supply-chain visibility'],['DECIDE','Business Action','Scheduling, purchasing, inventory decisions']],chips:['SQL Server','ERP','MRP','BOM','Inventory','Reporting','Data Integrity'],controls:['Defined relational data model','Reusable reporting queries instead of manual extracts','Traceable production and purchasing relationships','Test-plan and root-cause-analysis documentation']},
'ai-manufacturing-support-agent':{category:'AI + IT SUPPORT',title:'AI Manufacturing Support Agent',summary:'Grounded support-agent blueprint for manufacturing IT and ERP troubleshooting using approved procedures, system documentation, and retrieval before response generation.',focus:'Manufacturing support',platform:'RAG + IT Operations',pattern:'Grounded troubleshooting',repo:'https://github.com/Strikerliker/ai-cloud-portfolio/tree/main/projects/ai-manufacturing-support-agent',nodes:[['USER','Plant / IT User','Support question or incident'],['AGENT','Support Interface','Captures the issue and context'],['RETRIEVE','Approved Knowledge','SOPs, ERP guides, support procedures'],['REASON','AI Support Agent','Generates grounded troubleshooting steps'],['RESOLVE','Cited Guidance','Actionable answer with escalation path']],chips:['RAG','Manufacturing IT','ERP Support','Knowledge Base','AI Assistant','Troubleshooting'],controls:['Responses grounded in approved support material','Clear escalation path for uncertain or high-impact issues','No direct production changes without authorization','Support knowledge can be updated independently of the model']}
};
const key=new URLSearchParams(location.search).get('project');const p=projects[key];const app=document.getElementById('app');
if(!p){app.innerHTML='<section class="wrap error"><h1>Project visual not found</h1><p>Return to the portfolio and choose a project.</p><div class="actions" style="justify-content:center"><a class="btn primary" href="../index.html#projects">Back to Projects</a></div></section>';}
else{document.title=p.title+' | Project Visual';const nodes=p.nodes.map(n=>`<div class="node"><i>${n[0]}</i><strong>${n[1]}</strong><p>${n[2]}</p></div>`).join('');const chips=p.chips.map(c=>`<span class="chip">${c}</span>`).join('');const controls=p.controls.map(c=>`<div class="control"><span class="dot"></span><span>${c}</span></div>`).join('');const repo=p.repo?`<a class="btn" href="${p.repo}" target="_blank" rel="noopener">View GitHub ↗</a>`:'';app.innerHTML=`<section class="hero"><div class="wrap"><div class="eyebrow">${p.category} · PROJECT VISUAL</div><h1>${p.title}</h1><p>${p.summary}</p><div class="stats"><div class="stat"><small>PRIMARY FOCUS</small><b>${p.focus}</b></div><div class="stat"><small>PLATFORM</small><b>${p.platform}</b></div><div class="stat"><small>DESIGN PATTERN</small><b>${p.pattern}</b></div></div><div class="board"><div class="boardhead"><div><div class="eyebrow">ARCHITECTURE FLOW</div><h2>How the solution fits together</h2></div><span>Portfolio architecture / implementation view</span></div><div class="flow">${nodes}</div></div><div class="lower"><section class="card"><h3>Technologies &amp; Capabilities</h3><div class="chips">${chips}</div><div class="actions"><a class="btn primary" href="../index.html#projects">Portfolio</a>${repo}</div><div class="note">This visual represents the project architecture and documented implementation pattern; it does not claim live production telemetry unless explicitly shown.</div></section><section class="card"><h3>Security / Engineering Controls</h3><div class="controls">${controls}</div></section></div></div></section>`;}
</script>
</body>
</html>
