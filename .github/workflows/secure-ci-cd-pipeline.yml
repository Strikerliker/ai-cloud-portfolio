name: Secure CI/CD Pipeline

on:
  push:
    paths:
      - 'projects/secure-ci-cd-pipeline/**'
      - '.github/workflows/secure-ci-cd-pipeline.yml'
  pull_request:
    paths:
      - 'projects/secure-ci-cd-pipeline/**'
      - '.github/workflows/secure-ci-cd-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-and-scan:
    name: Test and security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/secure-ci-cd-pipeline

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python syntax
        run: python -m py_compile app.py test_app.py

      - name: Run unit tests
        run: python -m unittest -v test_app.py

      - name: Install Bandit
        run: python -m pip install --disable-pip-version-check bandit

      - name: Run Bandit security scan
        run: bandit -q -r app.py

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/secure-ci-cd-pipeline/terraform

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  package:
    name: Package release artifact
    runs-on: ubuntu-latest
    needs:
      - test-and-scan
      - terraform-validate

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build immutable artifact
        run: |
          mkdir -p dist
          zip -j dist/secure-ci-cd-demo-${GITHUB_SHA}.zip projects/secure-ci-cd-pipeline/app.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: secure-ci-cd-demo
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Manual AWS deployment
    if: ${{ github.event_name == 'workflow_dispatch' && vars.AWS_ROLE_ARN != '' && vars.DEPLOY_BUCKET != '' }}
    runs-on: ubuntu-latest
    needs:
      - package
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: secure-ci-cd-demo
          path: dist

      - name: Configure short-lived AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: github-secure-cicd

      - name: Deploy artifact to encrypted S3 bucket
        run: aws s3 cp dist/ s3://${{ vars.DEPLOY_BUCKET }}/secure-ci-cd/ --recursive --only-show-errors
